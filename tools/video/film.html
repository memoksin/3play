<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>film</title>
<!--
  Pitch film body (storyboard steps 5-19), plays right after the approved intro (export/video/approved/intro_stack_v2_cut.mp4).
  Frame-exact: everything is a pure function of t (seconds). window.renderAt(t) draws one frame and returns a Promise
  (Godot clip frames are PNG sequences loaded on demand); frame N = renderAt(N / 60). Seeded randomness only.
  Godot footage: export/video/clips/<name>/%05d.png + clip.json {frames}. A missing clip draws a labelled PLACEHOLDER.
  Render: node tools/video/render.mjs film [--clips /abs/clips/dir]      Preview: film.html?t=12.5
  All timing lives in the TIMELINE table below.
-->
<style>
  @font-face { font-family: "VT323"; src: url("../../assets/fonts/VT323-Regular.ttf"); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
"use strict";
// ================================================================ TIMELINE (the only place to retime the film)
// Film-local seconds: film.mp4 starts at 0. In the final pitch film everything is INTRO_LEN later.
// clip  = folder in export/video/clips/ (Godot PNG sequence). in = clip in-point (seconds into the clip at `start`).
// speed = clip playback rate (optional). text = on-screen line (*stars* = amber highlight in statements).
// c_* rows are title cards (STACK PRESENTS style), s_* rows are statements (smaller, fg colour).
const INTRO_FILE_LEN = 8.0;           // approved intro file (export/video/approved/intro_stack_v2_cut.mp4)
const INTRO_CUT = 2.0;                // its first seconds are cut off in the final film (assemble.sh INTRO_CUT)
const INTRO_LEN = INTRO_FILE_LEN - INTRO_CUT;   // intro length in the final film
const SCENARIO_COUNT = 3;             // step 16: number of disaster scenarios
// The cuts sit on the music's grid: the bed (MUSIC, t33_music_bed.ogg) is 96 BPM, a beat every 0.625 s, its first
// downbeat at final 0.9 s, a bar every 4 beats (final 0.9, 3.4, ... 25.9 the drums come in, ... 53.4 the logo).
// B(k) = film seconds of beat k (k % 4 == 0: a bar). Rebuild the bed when the logo moves (tools/video/README.md).
const GRID = { first: 0.9, beat: 0.625 };   // final-film seconds
const B = (k) => +(GRID.first + k * GRID.beat - INTRO_LEN).toFixed(4);
const span = (a, b) => ({ start: B(a), len: +(B(b) - B(a)).toFixed(4) });   // a row from beat a to beat b
const FILM_LEN = 53.95;               // film.mp4 length: 6.0 s intro + 53.95 s = 59.95 s (the limit is 60)
// moments inside the Godot clips (clip seconds) that the grid places
const LAMP_CLIP = 1.25;               // fener_mini: the lamp clicks on
const LOCK_CLIP = 4.92;               // globe_full: the game's crosshair closes on the Indian Ocean
const HIT_CLIP = 13.15;               // io_mini: the wave breaks over the town
const CUT_CLIP = 2.0;                 // fire_mini: the strained cut snaps through, the fence panel drops (frame 120)
const ROO_IN = 4.4;                   // fire_mini: the kangaroos run out through the gap (~4.3-6.1 s)
const OUT_CLIP = 8.9;                 // fire_mini: the flame goes out (frame 534; the jump cut to the hose is at 6.42 s)
const GLOBE_IN = +(LOCK_CLIP - (B(36) - B(29)) * 1.1).toFixed(4);           // the crosshair closes on bar 9 (beat 36)
const IO_B = { in: 9.45, speed: 1.25 };
const IO_B_START = +(B(52) - (HIT_CLIP - IO_B.in) / IO_B.speed).toFixed(4);  // the wave breaks on bar 13 (beat 52)
const TL = [
  // step id             start / len (beats)   clip / text
  { step: 5,  id: "dark",       start: 0.0, len: B(15) },
  { step: 5,  id: "s_hayat",    start: 1.8,  len: 2.35, text: "Hayatın *göremediğimiz* boyutları vardır" },   // beat 11 is 1.775
  { step: 6,  id: "diorama",    ...span(15, 21), clip: "kahr_diorama", in: 0.9 },          // past the game's fly-in, orbiting
  { step: 7,  id: "c_tahmin",   ...span(18, 21), text: "TAHMİN ET" },
  { step: 8,  id: "fener",      ...span(21, 29), clip: "fener_mini", in: +(LAMP_CLIP - B(22) + B(21)).toFixed(4) },   // a whistle in the dark, the lamp clicks on on beat 22, "ANNE" found, the family follows
  // the game's whole globe animation at 1.1x in one take: the spin (globe), then the lock and the zoom (lock), same clip
  { step: 9,  id: "globe",      start: B(29), len: 3.8, clip: "globe_full", in: GLOBE_IN, speed: 1.1 },
  { step: 9,  id: "c_kesfet",   start: B(30), len: 2.2, text: "KEŞFET" },
  // lock: the HUD locks `lock` s after start (the game's crosshair closes), extra push + flash from `zoom` s.
  // target = screen point (clip px) of the Indian Ocean when locked. hud: "brackets" (the game draws its own crosshair
  // and readout) or "full" (our own crosshair, rings and readout, for a clip without the game's lock UI).
  { step: 10, id: "lock",       start: B(29) + 3.8, len: +(B(40) - B(29) - 3.8).toFixed(4), clip: "globe_full", in: +(GLOBE_IN + 3.8 * 1.1).toFixed(4), speed: 1.1,
    lock: +(B(36) - B(29) - 3.8).toFixed(4), zoom: +(B(40) - B(29) - 3.8 - 0.4).toFixed(4), target: [960, 540], hud: "brackets" },
  { step: 11, id: "c_mudahale", ...span(40, 43), text: "MÜDAHALE ET" },                    // bar 10: the drums come in
  // the tsunami in one take: the drawback and the rising wall sped up (io_a), then the break and the flood (io_b)
  { step: 12, id: "io_a",       start: B(43), len: +(IO_B_START - B(43)).toFixed(4), clip: "io_mini", in: +(IO_B.in - (IO_B_START - B(43)) * 2.9).toFixed(4), speed: 2.9 },   // the pipes lock, the sea pulls back
  { step: 12, id: "io_b",       start: IO_B_START, len: +(B(54) - IO_B_START).toFixed(4), clip: "io_mini", in: IO_B.in, speed: IO_B.speed, hit: +(B(52) - IO_B_START).toFixed(4) },  // the wall; breaks at +hit (clip 13.15 s), the town floods
  { step: 13, id: "black",      ...span(54, 55) },
  { step: 14, id: "menu",       ...span(55, 62), clip: "menu_roles", in: 1.7 },           // opens like the eye; "Devlet" hovers ~+1.1, "Vatandaş" ~+3.2 (under TERCİH ET)
  { step: 14, id: "s_fark",     start: B(56), len: +(B(60) - B(56) + 0.05).toFixed(4), text: "Farkındalık *tek taraflı* değildir" },   // typed in 1.0 s, held ~1 s to read
  { step: 14, id: "c_tercih",   ...span(60, 62), text: "TERCİH ET" },
  { step: 15, id: "globe2",     ...span(62, 67), clip: "globe_spin2", in: 0.3, speed: 1.1 },
  { step: 15, id: "s_dunya",    ...span(63, 67), text: "Dünyanın *dört bir yanından*" },
  { step: 16, id: "s_count",    ...span(64, 67), text: `*${SCENARIO_COUNT}* afet senaryosu` },
  // Black Saturday, first person: the wire cutters cut the fence (fire_a, the cut on bar 17), cut to the kangaroos
  // running out (fire_b), cut to the hose on the flame in the way out (fire_c, the flame goes out on beat 74)
  { step: 16, id: "fire_a",     ...span(67, 69), clip: "fire_mini", in: +(CUT_CLIP - (B(68) - B(67)) * 1.15).toFixed(4), speed: 1.15 },
  { step: 16, id: "fire_b",     ...span(69, 71), clip: "fire_mini", in: ROO_IN, speed: 1.15 },
  { step: 16, id: "fire_c",     ...span(71, 75), clip: "fire_mini", in: +(OUT_CLIP - (B(74) - B(71)) * 1.1).toFixed(4), speed: 1.1 },
  { step: 17, id: "bunny",      ...span(75, 80), burst: +(B(77) - B(75)).toFixed(4) },     // the egg bursts on beat 77 (1.4 s at normal speed), the bunny at normal speed
  { step: 18, id: "s_easter",   start: B(76), len: +(B(80) - B(76) + 0.05).toFixed(4), text: "Belki bir de *easter egg*, kim bilir…" },
  { step: 19, id: "c_aaa",      ...span(80, 84), text: "AAA" },                           // bar 20; calm, like an "AAA game" label, GAME under it; it settles before "yok yok"
  { step: 19, id: "s_yok",      ...span(82, 84), text: "yok yok" },
  { step: 19, id: "logo",       ...span(84, 88), },                                        // bar 21: "3play" lands on the music's strongest beat, the same GAME under it, held
  { step: 19, id: "c_fark",     start: B(88), len: 0, text: "FARK ET" },                                  // bar 22; held; the CRT power-off (beat 93) closes it, len set below
  { step: 19, id: "end",        start: 0, len: 0 },                                        // pure black tail to FILM_LEN
];
const R = Object.fromEntries(TL.map((r) => [r.id, r]));
const end = (r) => r.start + r.len;
const CRT = 0.65;                     // the CRT power-off: the last seconds of FARK ET
R.c_fark.len = +(B(93) + CRT - B(88)).toFixed(4);
R.end.start = end(R.c_fark); R.end.len = +(FILM_LEN - R.end.start).toFixed(4);
// the music credit (Mountain Emperor is CC BY 4.0): final 56.6 s to the end, over FARK ET, the CRT and the black; drawn
// after the post pass (no bloom, grain or CRT on it), centred at the bottom, VT323 on a translucent black band
const CREDIT = {
  start: +(56.6 - INTRO_LEN).toFixed(4), fade: 0.4, px: 32, lh: 36, base: 958, band: [920, 1047], padX: 19,
  col: "rgb(216,221,230)", bandA: 150 / 255, thin: 0.2,
  lines: ['Music: "Mountain Emperor" by Kevin MacLeod (incompetech.com), licensed under CC BY 4.0',
    '(creativecommons.org/licenses/by/4.0). Edited: cut, time-stretched, layered.',
    '"Opening Theme V2" by nene (opengameart.org), CC0.'],
};
const EGG_BURST = 1.4;                    // scene seconds of the burst (cracks at 0.55 and 1.0); the picture is sped up to it
const EGG_SND = { file: "assets/audio/trailer/t27_egg_crack.ogg", c1: 0.34, c2: 0.58, burst: 1.08 };   // the cracks in the sound (s)
const eggBurstAt = () => R.bunny.burst;   // row seconds of the burst
// silent beats for the team's audio (film-local seconds); the visuals pulse on the heartbeats
// (lub, dub) pairs 0.45 s apart: the gap of t9_heartbeat.ogg, so the glow pulses on the sound
const HEART = [[0.22, 1], [0.67, 0.7], [1.32, 1], [1.77, 0.7], [R.black.start + 0.06, 0.8], [R.black.start + 0.51, 0.55]];
const VOICE = { t: 0.8, len: 1.2, text: "Sesimi duyan var mı?" };   // echoing voice over the dark
const CUTS = [R.fener.start, R.io_a.start, R.globe2.start, R.fire_a.start];   // glitch cuts

// ================================================================ SOUND (the mix: tools/video/mix.py reads it from export/video/film_audio.json)
// Every cue is tied to a row above, so retiming a row moves its sounds. Times are film seconds (`at`), or `final`
// seconds for the intro (it plays before the film). file = repo path; ss / dur = trim in the file (s); lu = loudness
// of the placed sound in LUFS before the master (tools/video/mix.py sets the gain from a measurement); peak = sample
// peak in dBFS instead, for sounds too short to measure; fade = [in, out] s; loop = repeat the trim to fill dur;
// tempo = speed-up (keeps pitch); ceil = peak cap of the layer (dBFS). Stems: the game's own sound captured with the clip (clip.wav), placed under its row.
const A = "assets/audio/";
const TYPE_STEP = 0.032;                                  // drawLine's default seconds per letter
const typeLen = (r, step = TYPE_STEP) => [...r.text.replace(/\*/g, "")].length * step;
const T11 = A + "trailer/t11_low_impact.ogg", G7 = A + "globe/glitch_corruption.ogg", G3 = A + "globe/keyboard_typing_loop.ogg";
const HEART_FILE = { file: A + "trailer/t9_heartbeat.ogg", lub: 0.15 };   // the lub peaks 0.15 s into the file
function cardHit(T, r, note) {                             // title card: low boom + the start of the glitch
  return [{ T, at: r.start, file: T11, lu: -22, ceil: -7, fade: [0, 1.2], dur: 3.2, note }, { T, at: r.start, file: G7, dur: 0.45, lu: -27, fade: [0, 0.12], note: note + " (glitch layer)" }];
}
function typing(T, r, dur, lu = -28, note = "typing") { return { T, at: r.start, file: G3, dur, lu, fade: [0.01, 0.06], note }; }
// One bed: t33_music_bed.ogg, built for this film from Opening Theme V2 (nene, CC0) and the drums of Mountain Emperor
// (Kevin MacLeod, CC BY 4.0) on the GRID above (tools/video/README.md, "Music bed"). It starts with the intro (final
// 0 s): the theme's quiet opening until bar 10 (final 25.9, MÜDAHALE ET), then the drums, a half-beat break and its
// strongest hit on the logo (bar 21, final 53.4). Its first 0.9 s (before the first downbeat) stay muted.
const MUSIC = {
  file: A + "trailer/t33_music_bed.ogg", final: 0, from: 0, lu: -19.5,
  keys: [[-INTRO_LEN, -80], [GRID.first - INTRO_LEN, -80], [GRID.first - INTRO_LEN + 0.6, -2], [0, 4], [B(15), 2], [B(39), 2], [B(40), 0],
    [B(54) - 0.02, 0], [B(54), -80], [B(55) - 0.01, -80], [B(55), -12], [B(56), 0],
    [B(93), 0], [B(93) + 0.6, -80]],
  // [film s, dB]: under the intro's storm, the quiet opening raised until the drums, out on the hard cut to black and
  // back as the menu opens, out with the CRT
  // ducks [film s, hold s, dB]: the bed steps back 2-3 dB while a key game sound plays, then comes back (0.06 s in,
  // 0.35 s out); in between, music and effects sit about level (tools/video/mix.py prints both buses)
  duck: [[R.fener.start + LAMP_CLIP - R.fener.in, 0.8, -2.5], [R.lock.start + R.lock.lock, 0.5, -2.5],
    [R.io_b.start + R.io_b.hit, 1.0, -3], [R.fire_a.start, end(R.fire_c) - R.fire_a.start - 0.4, -2.5],
    [R.c_aaa.start - 0.2, 0.9, -2], [R.s_yok.start, 0.6, -2.5]],
};
const STEMS = [                                           // row id, loudness, fades [in, out]
  { T: "T14b", row: "fener", lu: -21, ceil: -12, fade: [0.03, 0.3], note: "Fener in-game sound: wind, footsteps, the mother's whistle, lamp click (FN3), found (FN6)" },
  { T: "T15b", row: "globe", lu: -28, fade: [0.2, 0.0], note: "globe in-game sound at 1.1x: swell (G1), drone (G9)" },
  { T: "T17b", row: "lock", lu: -26, fade: [0.0, 0.1], note: "the same take, lock and zoom: drone, coordinates typing (G3), zoom whoosh (G5)" },
  { T: "T20", row: "io_a", lu: -22, fade: [0.03, 0.0], note: "Connect in-game sound at 2.9x: the pipes lock (C10), wave rising (C3)" },
  { T: "T20a", row: "io_b", lu: -20, fade: [0.0, 0.015], note: "Connect in-game sound at 1.25x: wave rising (C3), the wave hits (C4), water; hard cut" },
  { T: "T22", row: "menu", lu: -27, ceil: -14, fade: [0.3, 0.2], note: "role menu in-game sound: hover (M2) on Devlet, then on Vatandaş" },
  { T: "T25b", row: "globe2", lu: -28, fade: [0.03, 0.2], note: "second globe in-game sound at 1.1x (G9)" },
  { T: "T25f", row: "fire_a", lu: -22, ceil: -10, fade: [0.03, 0.03], note: "fire in-game sound: wind and fire (FR1), the cutters (FR5, FR5.2), the fence cut (FR6)" },
  { T: "T25g", row: "fire_b", lu: -22, ceil: -10, fade: [0.03, 0.03], note: "fire in-game sound: wind and fire (FR1), the kangaroos run (FR11)" },
  { T: "T25h", row: "fire_c", lu: -22, ceil: -10, fade: [0.03, 0.3], note: "fire in-game sound at 1.1x: the flame (FR9), the hose sprays (FR8), the flame goes out (FR6)" },
];
const IC = INTRO_CUT;                                     // intro cue times are in the intro file's seconds
const SFX = [
  // intro (approved picture, its first INTRO_CUT seconds cut off): times in the intro file minus the cut
  { T: "T1", final: 0, file: A + "trailer/t1_rain_loop.ogg", ss: IC, dur: 7.75 - IC, loop: true, lu: -26, fade: [0.3, 0.5], note: "rain under the intro" },
  { T: "T2", final: 2.4 - IC, file: A + "trailer/t2_far_thunder.ogg", lu: -28, fade: [0, 0.5], note: "distant sheet lightning" },
  { T: "T3", final: 2.8 - IC, file: A + "trailer/t3a_thunderclap.ogg", dur: 3.0, lu: -24, ceil: -7, fade: [0, 1.0], note: "close strike 1" },
  { T: "T3", final: 3.4 - IC, file: A + "trailer/t3b_close_strike.ogg", dur: 3.0, lu: -22, ceil: -6, fade: [0, 1.2], note: "close strike 2" },
  { T: "T4", final: 3.9 - IC, file: A + "trailer/t4_final_strike.ogg", dur: 3.8, lu: -22, ceil: -6, fade: [0, 1.5], note: "final strike (plain file, raised)" },
  { T: "T5", final: 4.45 - IC, file: G3, dur: 0.85, lu: -27, fade: [0.01, 0.06], note: "STACK PRESENTS typing" },
  { T: "T6", final: 5.5 - IC, file: A + "trailer/t2_far_thunder.ogg", lu: -29, fade: [0, 0.6], note: "last far strike" },
  { T: "T7", final: 6.05 - IC, file: A + "trailer/t7_noise_riser.ogg", lu: -27, ceil: -8, fade: [0.08, 0.05], note: "push into the eye (T8: silence from the black)" },
  // film
  ...HEART.filter((h, i) => i % 2 === 0).map(([t], i) => ({ T: i < 2 ? "T9" : "T21", at: t - HEART_FILE.lub, file: HEART_FILE.file, lu: i < 2 ? -20 : -22, note: "heartbeat (lub-dub)" })),
  { T: "T11", at: R.s_hayat.start, file: T11, lu: -23, ceil: -7, fade: [0, 1.5], dur: 3.5, note: "statement: Hayatın göremediğimiz boyutları vardır" },

  ...cardHit("T13", R.c_tahmin, "TAHMİN ET"),
  { T: "T14", at: R.fener.start, file: G7, dur: 0.45, lu: -23, fade: [0, 0.1], note: "glitch cut: Fener" },
  { T: "T15", at: R.globe.start - 2.1, file: A + "globe/whoosh.ogg", lu: -24, fade: [0.2, 0.4], note: "zoom-blur whip to the globe (peak on the cut)" },
  ...cardHit("T16", R.c_kesfet, "KEŞFET"),
  { T: "T17", at: R.lock.start + R.lock.lock, file: A + "globe/target_lock_trim.ogg", lu: -26, fade: [0, 0.1], note: "target lock (G4)" },
  ...cardHit("T19", R.c_mudahale, "MÜDAHALE ET"),
  { T: "T14", at: R.io_a.start, file: G7, dur: 0.45, lu: -24, fade: [0, 0.1], note: "glitch cut: Indian Ocean" },
  { T: "T20b", at: R.io_b.start + R.io_b.hit, file: T11, dur: 2.38, lu: -20, ceil: -6, fade: [0, 0.4], note: "the wave breaks over the town: low boom under the game's C4" },
  { T: "T23", at: R.s_fark.start, file: T11, dur: 1.6, lu: -26, ceil: -10, fade: [0, 0.8], note: "statement sting: Farkındalık tek taraflı değildir" },
  typing("T23b", R.s_fark, typeLen(R.s_fark)),
  ...cardHit("T24", R.c_tercih, "TERCİH ET"),
  { T: "T14", at: R.globe2.start, file: G7, dur: 0.45, lu: -24, fade: [0, 0.1], note: "glitch cut: second globe" },
  { T: "T25", at: R.globe2.start, file: A + "globe/spaceship_ambience.ogg", dur: R.globe2.len, lu: -28, fade: [0.3, 0.4], note: "globe spin ambience (G2)" },

  { T: "T25e", at: R.s_count.start + 0.45, file: A + "menu/ui_hover.ogg", peak: -17, note: "the digit 3 settles" },
  { T: "T14", at: R.fire_a.start, file: G7, dur: 0.45, lu: -24, fade: [0, 0.1], note: "glitch cut: Black Saturday fire" },
  { T: "T26", at: end(R.fire_c) - 0.4, file: G7, ss: 0.6, dur: 0.75, lu: -23, fade: [0.05, 0.2], note: "pixelate into the bunny scene" },
  { T: "T27", at: R.bunny.start + eggBurstAt() - EGG_SND.burst, file: EGG_SND.file, lu: -21, ceil: -8, fade: [0, 0.4], note: "egg cracks at normal speed: its two small cracks on the picture's, the big crack on the burst" },
  { T: "T28", at: R.s_easter.start, file: T11, dur: 1.6, lu: -27, ceil: -10, fade: [0, 0.8], note: "statement sting: Belki bir de easter egg" },
  typing("T28b", R.s_easter, typeLen(R.s_easter)),
  { T: "T29", at: R.c_aaa.start - 0.2, file: A + "globe/guitar_swell_trim.ogg", lu: -22, fade: [0, 0.3], note: "AAA GAME appears: calm swell (R1), no hit" },
  typing("T29b", R.s_yok, typeLen(R.s_yok, 0.07), -27, "yok yok types on"),
  { T: "T29c", at: R.logo.start, file: T11, dur: 4.0, lu: -22, ceil: -6, fade: [0, 1.6], note: "3play lands, under the bed's own hit" },
  ...cardHit("T30", R.c_fark, "FARK ET"),
  { T: "T31", at: end(R.c_fark) - CRT - 0.05, file: A + "trailer/t31_tv_off.ogg", peak: -9, note: "CRT power-off on FARK ET, at the very end" },
];

// ================================================================ config
const W = 1920, H = 1080, FPS = 60;
const DURATION = Math.max(...TL.map(end));
const PAL = { bg: [15, 12, 21], amber: [242, 193, 78], hot: [255, 90, 54], cool: [111, 211, 196], fg: [236, 228, 210] };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------------------------------------------------------------- helpers

const Q = new URLSearchParams(location.search);

// ---------------------------------------------------------------- text: title cards (STACK PRESENTS style) and statements
// title card: letter-by-letter glitch type-on, white-hot arrival, chroma split, block cursor, side rules.
// The verb is amber, the closing "ET" is teal (Tahmin ET, Keşf-ET, Müdahale ET, Tercih ET, Fark ET).

  const chars = [...r.text], et = r.text.lastIndexOf("ET"), split = et < 0 ? chars.length : et;   // no "ET": all amber
  const out = o.noOut ? 0 : smooth(T1 - (o.outDur || 0.4), T1, t);

    const a = smooth(T0 - 0.2, T0 + 0.3, t) * (1 - out) * o.scrim;
    const g = fx.createLinearGradient(0, H - 460, 0, H); g.addColorStop(0, "rgba(4,3,8,0)"); g.addColorStop(1, `rgba(4,3,8,${a})`);
    fx.fillStyle = g; fx.fillRect(0, H - 460, W, 460);

    const x = W / 2 + (xs[i] - W / 2) * spread;

    const g = o.calm ? 0 : clamp(1 - a / 0.16), f = frameOf(a);
    const gx = g * 22 * (hash1(i * 13 + f * 7 + T0) - 0.5), gy = g * 10 * (hash1(i * 31 + f * 3 + T0) - 0.5);
    const hot = o.calm ? 0.35 * clamp(1 - a / 0.5) : clamp(1 - a / 0.12), alpha = (1 - out) * (o.calm ? easeOut(a / 0.35) : f === 1 ? 0.35 : 1);

      fx.fillStyle = `rgba(40,200,255,${0.7 * g * alpha})`; fx.fillText(ch, x + gx - 9 * g, baseY + gy);

// statement: smaller, fg colour, *highlight* in amber, fast type-on with a small cursor, fades out at the row end.
function parseHL(text) { const a = []; let hl = false; for (const ch of text) { if (ch === "*") { hl = !hl; continue; } a.push({ ch, hl }); } return a; }
function drawLine(r, t, o = {}) {
  const T0 = r.start, T1 = end(r);

  const chars = parseHL(r.text);

    const g = fx.createLinearGradient(0, H - 420, 0, H); g.addColorStop(0, "rgba(4,3,8,0)"); g.addColorStop(1, `rgba(4,3,8,${a})`);
    fx.fillStyle = g; fx.fillRect(0, H - 420, W, 420);

function heartEnv(t) { let e = 0; for (const [b, a] of HEART) if (t >= b) e += a * smooth(0, 0.04, t - b) * Math.exp(-(t - b) * 5.5); return e; }

    g.addColorStop(0, `rgba(255,90,54,${0.13 * e})`); g.addColorStop(0.45, `rgba(120,30,40,${0.07 * e})`); g.addColorStop(1, "rgba(0,0,0,0)");

// ---------------------------------------------------------------- the darkness opens: an eye-shaped tear of light (rhymes with the intro's push into the eye)

  if (inRow(R.lock, t)) {
    const S = lockState(t);
    P.zb = Math.max(P.zb, 0.3 * smooth(0.1, 1, S.z));
    P.zc = [R.lock.target[0] / W, 1 - R.lock.target[1] / H];
    P.ca += 0.006 * S.z;

  if (t > end(R.lock) - 0.35 && t < R.c_mudahale.start + 1.2) { P.flash = Math.max(P.flash, 0.42 * fe); P.flashCol = [0.62, 0.95, 0.9]; }

  if (t >= g2 && t < g2 + 0.35) P.pix = Math.max(1, Math.round(lerp(40, 1, easeOut((t - g2) / 0.35))));

  const lu = t - R.logo.start;
  if (lu >= 0 && lu < 1.0) { P.flash = Math.max(P.flash, 0.2 * Math.exp(-lu * 7)); P.flashCol = [0.75, 0.85, 1.0]; P.zb = Math.max(P.zb, 0.14 * Math.exp(-lu * 9)); P.ca += 0.004 * Math.exp(-lu * 6); }
  // the CRT power-off ends FARK ET, then black
  const c0 = end(R.c_fark) - CRT;
  if (t >= c0 && t < end(R.c_fark)) P.crt = clamp((t - c0) / (CRT - 0.03));
  if (t >= end(R.c_fark)) P.fade = 0;
  return P;
}

// ---------------------------------------------------------------- frame
async function renderAt(t) {
  await prefetch(t);
  drawScene(t);
  const S = postState(t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.bindTexture(gl.TEXTURE_2D, fgTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, fg);
  const credit = drawCredit(t);
  if (credit > 0) { gl.bindTexture(gl.TEXTURE_2D, ovTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ov); }
  const scene = { t: fgTex, w: W, h: H };
  pass(P.bright, RT.a1, { uSrc: scene.t }, { uTexel: [1 / W * 2, 1 / H * 2], uThr: S.thr });
  blur(RT.a1, RT.b1, RT.a1, 1.6);
  blur(RT.a1, RT.b1, RT.a1, 3.0);
  pass(P.blur, RT.a2, { uSrc: RT.a1.t }, { uDir: [0, 0] });
  blur(RT.a2, RT.b2, RT.a2, 2.0);
  blur(RT.a2, RT.b2, RT.a2, 4.0);
  pass(P.final, null, { uScene: fgTex, uB1: RT.a1.t, uB2: RT.a2.t, uOver: ovTex }, {
    uShake: S.shake, uZC: S.zc, uCA: S.ca, uZoomBlur: S.zb, uFade: S.fade, uFrame: Math.round(t * FPS), uGlitch: S.glitch,
    uPix: S.pix, uCRT: S.crt, uFlash: S.flash, uFlashCol: S.flashCol, uBloom: S.bloom, uVig: S.vig, uOverOn: credit > 0 ? 1 : 0,
  });
  gl.finish();
  return Math.round(t * FPS);
}

// ---------------------------------------------------------------- cue sheet for the audio team (final-film seconds = INTRO_LEN + film seconds)
function cues() {
  const c = HEART.map(([t], i) => ({ film: t, what: `heartbeat (${i % 2 ? "dub" : "lub"})` }));
  c.push({ film: R.diorama.start, what: "darkness tears open: snowy Kahramanmaraş diorama" }, { film: R.fener.start + LAMP_CLIP - R.fener.in, what: "Fener: the lamp clicks on, the mother is found" },
    { film: R.globe.start - 0.3, what: "zoom-blur whip to the globe" }, { film: R.lock.start + R.lock.lock, what: "target lock (Indian Ocean)" },
    { film: R.io_b.start + R.io_b.hit, what: "the wave breaks over the town" }, { film: R.black.start, what: "hard cut to black" },
    { film: R.menu.start, what: "role menu opens (eye again)" }, { film: R.fire_a.start, what: "Black Saturday fire: cut the fence" },
    { film: R.fire_b.start, what: "the kangaroos run out" }, { film: R.fire_c.start, what: "the hose on the flame" },
    { film: R.fire_c.start + (OUT_CLIP - R.fire_c.in) / R.fire_c.speed, what: "the flame goes out" }, { film: end(R.fire_c) - 0.4, what: "pixelate into the bunny scene" },
    { film: R.logo.start, what: "3play lands" });
  c.push({ film: VOICE.t, len: VOICE.len, what: `voice, echoing: "${VOICE.text}" (dropped: no voice, the rings stay)` });
  for (const r of TL) if (r.text) c.push({ film: r.start, len: r.len, what: `${r.id.startsWith("c_") ? "title card" : "statement"}: ${r.text.replace(/\*/g, "")}` });
  for (const t of CUTS) c.push({ film: t, what: "glitch cut" });
  c.push({ film: end(R.lock) - 0.35, what: "zoom flash into the ocean" });
  c.push({ film: R.bunny.start + eggBurstAt(), what: "egg bursts, bunny pops out" });
  c.push({ film: end(R.c_fark) - CRT, what: "CRT power-off on FARK ET" }, { film: R.end.start, what: "black (end)" });
  c.push({ film: CREDIT.start, len: FILM_LEN - CREDIT.start, what: "music credit (CC BY 4.0), fades in over 0.4 s, to the end" });
  return c.map((x) => ({ ...x, film: +x.film.toFixed(2), final: +(x.film + INTRO_LEN).toFixed(2) })).sort((a, b) => a.film - b.film);
}

// ---------------------------------------------------------------- boot
// the bed's volume curve with the ducks added: both are piecewise linear, so their sum is exact at the union of the
// breakpoints (a duck: 0.06 s down, `hold` s at `db`, 0.35 s back)
function duckKeys(keys, ducks) {
  const at = (pts, t) => {
    if (t <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) return pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * (t - pts[i - 1][0]) / Math.max(pts[i][0] - pts[i - 1][0], 1e-6);
    return pts[pts.length - 1][1];
  };
  const shapes = ducks.map(([t, hold, db]) => [[t - 0.06, 0], [t, db], [t + hold, db], [t + hold + 0.35, 0]]);
  const ts = [...new Set([...keys.map((k) => k[0]), ...shapes.flat().map((k) => k[0])])].sort((a, b) => a - b);
  return ts.map((t) => { const base = at(keys, t); return [t, base <= -79 ? base : base + shapes.reduce((s, d) => s + at(d, t), 0)]; });
}
function audioPlan() {                                   // final-film seconds for tools/video/mix.py
  const fin = (c) => +((c.final ?? c.at + INTRO_LEN)).toFixed(3);
  return {
    intro: INTRO_LEN, length: +(INTRO_LEN + DURATION).toFixed(3),
    music: { file: MUSIC.file, from: MUSIC.from, lu: MUSIC.lu, start: MUSIC.final, grid: GRID,
      keys: duckKeys(MUSIC.keys, MUSIC.duck).map(([t, db]) => [+(t + INTRO_LEN - MUSIC.final).toFixed(3), +db.toFixed(2)]) },
    stems: STEMS.map((s) => { const r = R[s.row]; return { ...s, clip: r.clip, in: r.in, speed: r.speed || 1, at: +(r.start + INTRO_LEN).toFixed(3), len: r.len }; }),
    sfx: SFX.map((c) => ({ ...c, at: fin(c), final: undefined })).sort((a, b) => a.at - b.at),
  };
}
window.SEGMENT = { name: "film", fps: FPS, duration: DURATION, frames: Math.round(DURATION * FPS), cues: cues(), audio: audioPlan() };
(async () => {
  for (const name of new Set(TL.filter((r) => r.clip).map((r) => r.clip))) CLIPS[name] = await probeClip(name);
  window.SEGMENT.clips = Object.fromEntries(Object.entries(CLIPS).map(([k, v]) => [k, v ? v.frames : "PLACEHOLDER"]));
  await document.fonts.load("172px VT323");
  window.renderAt = renderAt;
  await renderAt(Q.has("t") ? parseFloat(Q.get("t")) : 0);
  document.documentElement.dataset.ready = "1";
})().catch((e) => { document.documentElement.dataset.error = String(e); console.error(e); });
</script>
