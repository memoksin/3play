<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>film</title>
<!--
  Pitch film body (storyboard steps 5-19), plays right after the approved intro (export/video/approved/intro_stack_v2_cut.mp4).
  Frame-exact: everything is a pure function of t (seconds). window.renderAt(t) draws one frame and returns a Promise
  (Godot clip frames are PNG sequences loaded on demand); frame N = renderAt(N / 60). Seeded randomness only.
  Godot footage: export/video/clips/<name>/%05d.png + clip.json {frames}. A missing clip draws a labelled PLACEHOLDER.
  Render: node tools/video/render.mjs film [--clips /abs/clips/dir]      Preview: film.html?t=12.5
  All timing lives in the TIMELINE table below.
-->
<style>
  @font-face { font-family: "VT323"; src: url("../../assets/fonts/VT323-Regular.ttf"); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
"use strict";
// ================================================================ TIMELINE (the only place to retime the film)
// Film-local seconds: film.mp4 starts at 0. In the final pitch film everything is INTRO_LEN later.
// clip  = folder in export/video/clips/ (Godot PNG sequence). in = clip in-point (seconds into the clip at `start`).
// speed = clip playback rate (optional). text = on-screen line (*stars* = amber highlight in statements).
// c_* rows are title cards (STACK PRESENTS style), s_* rows are statements (smaller, fg colour).
const INTRO_LEN = 8.0;                // approved intro length (export/video/approved/intro_stack_v2_cut.mp4)
const SCENARIO_COUNT = 3;             // step 16: number of disaster scenarios
const TL = [
  // step id             start   len   clip / text
  { step: 5,  id: "dark",       start: 0.0,  len: 4.4 },
  { step: 5,  id: "s_hayat",    start: 2.0,  len: 2.35, text: "Hayatın *göremediğimiz* boyutları vardır" },
  { step: 6,  id: "diorama",    start: 4.4,  len: 4.2,  clip: "kahr_diorama", in: 0.9 },          // past the game's fly-in, orbiting
  { step: 7,  id: "c_tahmin",   start: 6.3,  len: 2.3,  text: "TAHMİN ET" },
  { step: 8,  id: "kahr_mini",  start: 8.6,  len: 2.9,  clip: "kahr_mini", in: 2.6 },             // two drags (Elif Bebek, Soba) land in the cut
  { step: 9,  id: "globe",      start: 11.5, len: 3.0,  clip: "globe_spin", in: 0.5 },
  { step: 9,  id: "c_kesfet",   start: 12.2, len: 2.3,  text: "KEŞFET" },
  // lock: the HUD locks `lock` s after start (the game's crosshair closes at clip 4.67 s), extra push + flash from `zoom` s.
  // target = screen point (clip px) of the Indian Ocean when locked. hud: "brackets" (the game draws its own crosshair
  // and readout) or "full" (our own crosshair, rings and readout, for a clip without the game's lock UI).
  { step: 10, id: "lock",       start: 14.5, len: 3.6,  clip: "globe_lock_io", in: 1.6, speed: 1.5, lock: 2.05, zoom: 3.2, target: [960, 540], hud: "brackets" },
  { step: 11, id: "c_mudahale", start: 18.1, len: 1.9,  text: "MÜDAHALE ET" },
  { step: 12, id: "io_mini",    start: 20.0, len: 3.0,  clip: "io_mini", in: 6.5, speed: 1.1 },   // last rotations, "Dalga geldi!", water flows
  { step: 13, id: "black",      start: 23.0, len: 0.7 },
  { step: 14, id: "menu",       start: 23.7, len: 4.6,  clip: "menu_roles", in: 0.3 },           // "Devlet" hovers ~26.4, under TERCİH ET
  { step: 14, id: "s_fark",     start: 24.25, len: 2.0, text: "Farkındalık *tek taraflı* değildir" },
  { step: 14, id: "c_tercih",   start: 26.3, len: 2.0,  text: "TERCİH ET" },
  { step: 15, id: "globe2",     start: 28.3, len: 3.8,  clip: "globe_spin2", in: 0.3 },
  { step: 15, id: "s_dunya",    start: 28.6, len: 3.5,  text: "Dünyanın *dört bir yanından*" },
  { step: 16, id: "s_count",    start: 29.9, len: 2.2,  text: `*${SCENARIO_COUNT}* afet senaryosu` },
  { step: 17, id: "bunny",      start: 32.1, len: 3.7 },
  { step: 18, id: "s_easter",   start: 33.6, len: 2.2,  text: "Belki bir de *easter egg*, kim bilir…" },
  { step: 19, id: "result",     start: 35.8, len: 3.6,  clip: "result_card", in: 0.5 },          // the closing line types on 36.4-37.9
  { step: 19, id: "c_fark",     start: 39.4, len: 2.4,  text: "FARK ET" },
  { step: 19, id: "end",        start: 41.8, len: 0.5 },   // pure black tail
];
const R = Object.fromEntries(TL.map((r) => [r.id, r]));
const end = (r) => r.start + r.len;
// silent beats for the team's audio (film-local seconds); the visuals pulse on the heartbeats
const HEART = [[0.22, 1], [0.50, 0.7], [1.22, 1], [1.50, 0.7], [R.black.start + 0.12, 0.8], [R.black.start + 0.40, 0.55]];
const VOICE = { t: 0.8, len: 1.2, text: "Sesimi duyan var mı?" };   // echoing voice over the dark
const CUTS = [R.kahr_mini.start, R.io_mini.start, R.globe2.start, R.result.start];   // glitch cuts

// ================================================================ config
const W = 1920, H = 1080, FPS = 60;
const DURATION = Math.max(...TL.map(end));
const PAL = { bg: [15, 12, 21], amber: [242, 193, 78], hot: [255, 90, 54], cool: [111, 211, 196], fg: [236, 228, 210] };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------------------------------------------------------------- helpers
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const easeOut = (u) => 1 - Math.pow(1 - clamp(u), 3);
const easeIn = (u) => Math.pow(clamp(u), 3);
const easeOutBack = (u) => { u = clamp(u); const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const hash1 = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u) * 2 - 1; }
const frameOf = (dt) => Math.floor(dt * FPS + 1e-6);
const inRow = (r, t, pre = 0, post = 0) => t >= r.start - pre && t < end(r) + post;

// ---------------------------------------------------------------- clips (Godot PNG sequences)
const Q = new URLSearchParams(location.search);
const CLIP_ROOT = Q.get("clips") || "../../export/video/clips/";
const CLIPS = {};                         // name -> { frames, base } or null (placeholder)
async function probeClip(name) {
  try {
    const r = await fetch(`${CLIP_ROOT}${name}/clip.json`, { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    const b0 = await fetch(`${CLIP_ROOT}${name}/00000.png`, { method: "HEAD", cache: "no-store" });
    return { frames: j.frames, base: b0.ok ? 0 : 1 };
  } catch { return null; }
}
const cache = new Map();                  // "name:idx" -> Promise<ImageBitmap|null>, small LRU
function loadFrame(name, idx) {
  const k = name + ":" + idx;
  if (cache.has(k)) { const p = cache.get(k); cache.delete(k); cache.set(k, p); return p; }
  const p = fetch(`${CLIP_ROOT}${name}/${String(idx).padStart(5, "0")}.png`, { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.blob(); }).then((b) => createImageBitmap(b))
    .catch(() => null);
  cache.set(k, p);
  while (cache.size > 12) { const [k0, p0] = cache.entries().next().value; cache.delete(k0); p0.then((b) => b && b.close()); }
  return p;
}
function clipFrame(r, t) {                // raw frame number in the clip (clamped to the clip when it exists)
  const f = Math.round((r.in + Math.max(0, t - r.start) * (r.speed || 1)) * FPS);
  const m = CLIPS[r.clip];
  return m ? Math.min(m.frames - 1, f) : f;
}
const FR = {};                            // row id -> ImageBitmap for the current frame
async function prefetch(t) {
  const rows = TL.filter((r) => r.clip && inRow(r, t, 0.7, 0.7));
  await Promise.all(rows.map(async (r) => {
    const m = CLIPS[r.clip];
    FR[r.id] = m ? await loadFrame(r.clip, clipFrame(r, t) + m.base) : null;
  }));
}

// ---------------------------------------------------------------- canvases
const out = document.getElementById("out");
const fg = document.createElement("canvas"); fg.width = W; fg.height = H;
const fx = fg.getContext("2d");
fx.imageSmoothingEnabled = true; fx.imageSmoothingQuality = "high";

// draw a clip row (or its placeholder) at the current transform
function drawClip(r, t, o = {}) {
  const sc = o.scale ?? 1, cx = o.cx ?? W / 2, cy = o.cy ?? H / 2;
  fx.save();
  fx.globalAlpha = o.alpha ?? 1;
  fx.translate(cx, cy + (o.dy || 0)); fx.scale(sc, sc); fx.translate(-cx, -cy);
  const img = FR[r.id];
  if (img) fx.drawImage(img, 0, 0, W, H);
  else drawPlaceholder(r, clipFrame(r, t), t);
  fx.restore();
}

// ---------------------------------------------------------------- placeholders (only while the Godot clips are missing)
function phLabel(name, f) {
  fx.save();
  fx.font = "34px VT323"; fx.textBaseline = "top";
  const s = `PLACEHOLDER  clip: ${name}  frame ${String(f).padStart(4, "0")}`;
  fx.fillStyle = "rgba(255,90,54,0.85)"; fx.fillRect(60, 60, fx.measureText(s).width + 28, 44);
  fx.fillStyle = "#0f0c15"; fx.fillText(s, 74, 66);
  fx.restore();
}
function phGlobe(f, mode) {
  // wireframe orthographic globe; "lock" decelerates and stops with the Indian Ocean (lat 5.55, lon 95.32) in the centre
  const s = f / FPS, Rg = 400, cx = W / 2, cy = H / 2;
  let lon0, tilt = mode === "spin2" ? 0.42 : 0.18;
  if (mode === "lock") { const L = R.lock.lock + R.lock.in, u = clamp(s / L); lon0 = 95.32 - 160 * Math.pow(1 - u, 2.2); tilt = lerp(0.3, 5.55 * Math.PI / 180, easeOut(u)); }
  else lon0 = (mode === "spin2" ? -40 + s * 34 : 10 + s * 22);
  const g = fx.createRadialGradient(cx - 120, cy - 140, 40, cx, cy, Rg);
  g.addColorStop(0, "#1d3a4a"); g.addColorStop(1, "#0a1520");
  fx.fillStyle = "#07060b"; fx.fillRect(0, 0, W, H);
  fx.fillStyle = g; fx.beginPath(); fx.arc(cx, cy, Rg, 0, Math.PI * 2); fx.fill();
  const proj = (la, lo) => {
    const a = la * Math.PI / 180, b = (lo - lon0) * Math.PI / 180;
    const x = Math.cos(a) * Math.sin(b), y = Math.cos(tilt) * Math.sin(a) - Math.sin(tilt) * Math.cos(a) * Math.cos(b);
    const z = Math.sin(tilt) * Math.sin(a) + Math.cos(tilt) * Math.cos(a) * Math.cos(b);
    return [cx + Rg * x, cy - Rg * y, z];
  };
  fx.lineWidth = 1.5;
  const line = (pts) => { fx.beginPath(); let on = false; for (const [x, y, z] of pts) { if (z > 0) { on ? fx.lineTo(x, y) : fx.moveTo(x, y); on = true; } else on = false; } fx.stroke(); };
  fx.strokeStyle = "rgba(111,211,196,0.35)";
  for (let lo = -180; lo < 180; lo += 20) line([...Array(61).keys()].map((i) => proj(-90 + i * 3, lo)));
  for (let la = -60; la <= 60; la += 20) line([...Array(121).keys()].map((i) => proj(la, -180 + i * 3)));
  for (const [la, lo, c] of [[37.58, 36.93, "#f2c14e"], [5.55, 95.32, "#6fd3c4"], [0, -150, "#ff5a36"]]) {
    const [x, y, z] = proj(la, lo); if (z <= 0) continue;
    fx.fillStyle = c; fx.beginPath(); fx.arc(x, y, 9, 0, Math.PI * 2); fx.fill();
  }
  fx.strokeStyle = "rgba(111,211,196,0.6)"; fx.lineWidth = 3; fx.beginPath(); fx.arc(cx, cy, Rg, 0, Math.PI * 2); fx.stroke();
}
function drawPlaceholder(r, f, t) {
  const s = f / FPS;
  fx.save();
  if (r.clip.startsWith("globe")) phGlobe(f, r.clip === "globe_lock_io" ? "lock" : r.clip === "globe_spin2" ? "spin2" : "spin");
  else if (r.clip === "kahr_diorama") {
    const sky = fx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#1a2233"); sky.addColorStop(1, "#3a4252");
    fx.fillStyle = sky; fx.fillRect(0, 0, W, H);
    const dx = -s * 18;
    fx.fillStyle = "#c9ccd6"; fx.fillRect(0, 760, W, 320);
    const rng = mulberry32(77);
    for (let i = 0; i < 9; i++) {
      const bw = 150 + rng() * 140, bh = 180 + rng() * 260, bx = 80 + i * 205 + dx, by = 780 - bh;
      fx.fillStyle = "#23283a"; fx.fillRect(bx, by, bw, bh);
      fx.fillStyle = "#e6e9f0"; fx.fillRect(bx - 8, by - 14, bw + 16, 18);
      for (let k = 0; k < 6; k++) { fx.fillStyle = rng() < 0.5 ? "#f2c14e" : "#2e3448"; fx.fillRect(bx + 20 + (k % 3) * (bw - 50) / 2.2, by + 30 + Math.floor(k / 3) * 70, 26, 34); }
    }
  } else if (r.clip === "kahr_mini" || r.clip === "io_mini") {
    const io = r.clip === "io_mini";
    fx.fillStyle = io ? "#0b1a22" : "#1b1622"; fx.fillRect(0, 0, W, H);
    const n = Math.floor(s * 2.2), cols = 8, rows = 5, cs = 130, ox = W / 2 - cols * cs / 2, oy = H / 2 - rows * cs / 2 + 40;
    for (let i = 0; i < cols * rows; i++) {
      const x = ox + (i % cols) * cs, y = oy + Math.floor(i / cols) * cs;
      fx.strokeStyle = "rgba(236,228,210,0.18)"; fx.lineWidth = 2; fx.strokeRect(x + 4, y + 4, cs - 8, cs - 8);
      if (io) {
        const rot = Math.round(hash1(i * 3.1) * 4 + (i % 5 === n % 5 ? s * 4 : 0)) * Math.PI / 2;
        fx.save(); fx.translate(x + cs / 2, y + cs / 2); fx.rotate(rot);
        fx.strokeStyle = i < n * 3 ? "#6fd3c4" : "rgba(111,211,196,0.35)"; fx.lineWidth = 18;
        fx.beginPath(); fx.moveTo(-cs / 2 + 6, 0); fx.lineTo(0, 0); fx.lineTo(0, cs / 2 - 6); fx.stroke(); fx.restore();
      } else if (hash1(i * 7.7) < 0.12 * n) {
        fx.fillStyle = ["#f2c14e", "#ff5a36", "#6fd3c4"][i % 3]; fx.fillRect(x + 20, y + 20, cs - 40, cs - 40);
      }
    }
    if (!io) { const k = (s * 0.9) % 1; fx.fillStyle = "#ece4d2"; fx.fillRect(lerp(200, 1300, k), lerp(900, 420, k), 90, 90); }
  } else if (r.clip === "menu_roles") {
    fx.fillStyle = "#0f0c15"; fx.fillRect(0, 0, W, H);
    fx.font = "120px VT323"; fx.textAlign = "center"; fx.fillStyle = "#ece4d2"; fx.fillText("3PLAY", W / 2, 300);
    const hov = s > 1.4 ? 1 : 0;
    for (let i = 0; i < 2; i++) {
      const x = W / 2 + (i ? 60 : -460), on = i === hov;
      fx.fillStyle = on ? "rgba(242,193,78,0.25)" : "rgba(236,228,210,0.06)"; fx.fillRect(x, 470, 400, 260);
      fx.strokeStyle = on ? "#f2c14e" : "rgba(236,228,210,0.3)"; fx.lineWidth = 4; fx.strokeRect(x, 470, 400, 260);
      fx.font = "64px VT323"; fx.fillStyle = on ? "#f2c14e" : "#ece4d2"; fx.fillText(`ROL ${i + 1}`, x + 200, 620);
    }
  } else if (r.clip === "result_card") {
    fx.fillStyle = "#0f0c15"; fx.fillRect(0, 0, W, H);
    fx.fillStyle = "#1c1726"; fx.fillRect(460, 160, 1000, 760); fx.strokeStyle = "#f2c14e"; fx.lineWidth = 4; fx.strokeRect(460, 160, 1000, 760);
    fx.font = "80px VT323"; fx.fillStyle = "#f2c14e"; fx.fillText("SONUÇ", 520, 270);
    for (let i = 0; i < 5; i++) { fx.fillStyle = "rgba(236,228,210,0.25)"; fx.fillRect(520, 340 + i * 70, 880 - i * 90, 26); }
    const line = "kapanış cümlesi yazılıyor...", n = clamp(Math.floor(s * 14), 0, line.length);
    fx.font = "56px VT323"; fx.fillStyle = "#ece4d2"; fx.fillText(line.slice(0, n), 520, 840);
  }
  phLabel(r.clip, f);
  fx.restore();
}

// ---------------------------------------------------------------- text: title cards (STACK PRESENTS style) and statements
// title card: letter-by-letter glitch type-on, white-hot arrival, chroma split, block cursor, side rules.
// The verb is amber, the closing "ET" is teal (Tahmin ET, Keşf-ET, Müdahale ET, Tercih ET, Fark ET).
const AMB = { col: [255, 210, 120], glow: "255,150,50" }, COOL = { col: [150, 232, 220], glow: "60,200,190" };
function drawCard(r, t, o = {}) {
  const T0 = r.start, T1 = end(r);
  if (t < T0 || t >= T1) return;
  const px = o.px || 172, baseY = o.y || 990, step = o.step || 0.058;
  const chars = [...r.text], split = r.text.lastIndexOf("ET");
  const out = o.noOut ? 0 : smooth(T1 - 0.4, T1, t);
  fx.save();
  if (o.scrim) {
    const a = smooth(T0 - 0.2, T0 + 0.3, t) * (1 - out) * o.scrim;
    const g = fx.createLinearGradient(0, H - 460, 0, H); g.addColorStop(0, "rgba(4,3,8,0)"); g.addColorStop(1, `rgba(4,3,8,${a})`);
    fx.fillStyle = g; fx.fillRect(0, H - 460, W, 460);
  }
  fx.font = `${px}px VT323`; fx.textBaseline = "alphabetic";
  const track = px * 0.12, ws = chars.map((ch) => fx.measureText(ch).width + track);
  let x0 = W / 2 - (ws.reduce((a, b) => a + b, 0) - track) / 2;
  const xs = ws.map((w) => { const x = x0; x0 += w; return x; });
  const spread = 1 + 0.5 * out * out;
  let li = 0, gaps = 0, lastEnd = 0, shown = 0, lastT = T0;
  const nLetters = chars.filter((c) => c !== " ").length;
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i]; if (ch === " ") { gaps++; continue; }
    const ti = T0 + li * step + gaps * 0.12; li++; lastT = ti;
    const a = t - ti; if (a < 0) continue;
    const sty = i >= split ? COOL : AMB;
    const x = W / 2 + (xs[i] - W / 2) * spread;
    const g = clamp(1 - a / 0.16), f = frameOf(a);
    const gx = g * 22 * (hash1(i * 13 + f * 7 + T0) - 0.5), gy = g * 10 * (hash1(i * 31 + f * 3 + T0) - 0.5);
    const hot = clamp(1 - a / 0.12), alpha = (1 - out) * (f === 1 ? 0.35 : 1);
    const c = sty.col.map((v) => Math.round(lerp(v, 255, hot)));
    fx.globalCompositeOperation = "lighter";
    fx.shadowColor = `rgba(${sty.glow},${0.9 * alpha})`; fx.shadowBlur = 28 + 40 * hot;
    fx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`; fx.fillText(ch, x + gx, baseY + gy);
    fx.shadowBlur = 0;
    if (g > 0) {
      fx.fillStyle = `rgba(255,40,60,${0.7 * g * alpha})`; fx.fillText(ch, x + gx + 9 * g, baseY + gy);
      fx.fillStyle = `rgba(40,200,255,${0.7 * g * alpha})`; fx.fillText(ch, x + gx - 9 * g, baseY + gy);
    }
    lastEnd = x + fx.measureText(ch).width; shown++;
  }
  const done = shown === nLetters;
  const blinkOn = !done || Math.floor((t - lastT) * 3.2) % 2 === 0;
  if (shown > 0 && blinkOn && out < 0.5 && !(o.cursorOff && t > o.cursorOff)) {
    const cw = px * 0.36, chh = px * 0.62;
    fx.globalCompositeOperation = "lighter";
    fx.shadowColor = "rgba(111,211,196,0.9)"; fx.shadowBlur = 30;
    fx.fillStyle = `rgba(236,240,235,${done ? 0.85 : 0.95})`;
    fx.fillRect(lastEnd + px * 0.1, baseY - chh, cw, chh);
    fx.shadowBlur = 0;
  }
  const ru = smooth(lastT + 0.15, lastT + 0.6, t) * (1 - out);
  if (ru > 0) {
    const L = (o.rule || 260) * ru, y = baseY - px * 0.3;
    const right = xs[chars.length - 1] + fx.measureText(chars[chars.length - 1]).width + px * 0.46 + 40;
    fx.globalCompositeOperation = "lighter";
    fx.fillStyle = `rgba(236,228,210,${0.5 * ru})`;
    fx.fillRect(xs[0] - 40 - L, y, L, 2); fx.fillRect(right, y, L, 2);
  }
  fx.restore();
}
// statement: smaller, fg colour, *highlight* in amber, fast type-on with a small cursor, fades out at the row end.
function parseHL(text) { const a = []; let hl = false; for (const ch of text) { if (ch === "*") { hl = !hl; continue; } a.push({ ch, hl }); } return a; }
function drawLine(r, t, o = {}) {
  const T0 = r.start, T1 = end(r);
  if (t < T0 || t >= T1) return;
  const px = o.px || 80, y = o.y || 990, step = o.step || 0.032, hs = o.hlScale || 1;
  const chars = parseHL(r.text);
  const out = smooth(T1 - 0.45, T1, t);
  fx.save();
  if (o.scrim) {
    const a = smooth(T0 - 0.2, T0 + 0.3, t) * (1 - out) * o.scrim;
    const g = fx.createLinearGradient(0, H - 420, 0, H); g.addColorStop(0, "rgba(4,3,8,0)"); g.addColorStop(1, `rgba(4,3,8,${a})`);

      lput(cx + x, cy + hy + y, x > 3 || y > 4 ? PC.furS : PC.fur);
    }
    const blink = (u > 2.3 && u < 2.38) || (u > 3.05 && u < 3.12);
    for (const ex of [-4, 2]) {
      if (blink) { lput(cx + ex, cy + hy, PC.eye); lput(cx + ex + 1, cy + hy, PC.eye); }
      else { lput(cx + ex, cy + hy - 1, PC.eggL); lput(cx + ex + 1, cy + hy - 1, PC.eye); lput(cx + ex, cy + hy, PC.eye); lput(cx + ex + 1, cy + hy, PC.eye); }
    }
    lput(cx - 1, cy + hy + 2, PC.hot); lput(cx, cy + hy + 2, PC.hot);
    lput(cx - 6, cy + hy + 2, PC.pink); lput(cx + 5, cy + hy + 2, PC.pink);
    stamp();
  }
  // egg (whole before the burst, lower shell after); cracks drawn into it
  const crackW = u >= T_C2 ? 12 : u >= T_C1 ? 3 + Math.round(4 * easeOut((u - T_C1) / 0.2)) : -1;
  for (let y = -ry; y <= ry; y++) for (let x = -EG.rx; x <= EG.rx; x++) {
    if (!inEgg(x, y)) continue;
    if (burst && y < crackY(x) + 1) continue;
    let c = eggColor(x, y);
    if (!burst && Math.abs(x) <= crackW && (y === crackY(x) || (y === crackY(x) + 1 && (x & 1)))) c = PC.out;
    lput(cx + x + shear(y), cy + y, c);
  }
  stamp();
  if (burst) {
    // paws on the rim
    if (bu > 0.3) { for (const px of [-7, 5]) for (let w = 0; w < 3; w++) { lput(cx + px + w, cy + crackY(px + w) - 1, PC.fur); lput(cx + px + w, cy + crackY(px + w), PC.fur); } stamp(); }
    // flying top shell: ballistic arc, lands upside-down on the ground to the right
    const FL = 0.6, p = clamp(bu / FL), bounce = bu > FL ? Math.round(2 * Math.abs(Math.sin((bu - FL) * 9)) * Math.exp(-(bu - FL) * 5)) : 0;
    const ox = 30 * Math.pow(p, 0.7), oy = lerp(-8, 8, p) - 46 * p * (1 - p) - bounce, th = Math.PI * easeOut(p);
    const c0 = Math.cos(th), s0 = Math.sin(th);
    for (let y = -16; y <= 16; y++) for (let x = -16; x <= 16; x++) {
      const sx = Math.round(c0 * x + s0 * y), sy = Math.round(-s0 * x + c0 * y) - 8;   // inverse rotate into shell space
      if (!inEgg(sx, sy) || sy >= crackY(sx) + 1) continue;
      lput(cx + ox + x, cy + oy + y, eggColor(sx, sy));
    }
    stamp();
    // pop: a ring of light pixels for a few frames
    if (bu < 0.2) {
      const rr = 6 + 70 * bu, n = 28;
      for (let k = 0; k < n; k++) if ((k + f) % 3) plus(cx + Math.cos(k / n * 6.283) * rr * 1.2, cy - 3 + Math.sin(k / n * 6.283) * rr * 0.8, k % 2 ? PC.amber : PC.eggL, false);
    }
    // sparkles from the burst, then idle twinkles
    for (const [i, s] of SPARK.entries()) {
      const L = 0.9; if (bu > L) break;
      if (hash1(i * 9.1 + f * 0.37) < 0.22) continue;
      plus(cx + s.vx * bu, cy - 3 + s.vy * bu + 55 * bu * bu, s.c, s.big && bu < 0.5);
    }
    STARS.forEach(([x, y], i) => {
      const ph = Math.floor((u * 6 + i * 1.7)) % 6;
      if (bu > 0.5 + i * 0.12 && ph < 3) plus(x, y, i % 2 ? PC.amber : PC.cool, ph === 1);
    });
  }
  pcx.putImageData(pimg, 0, 0);
  fx.save(); fx.imageSmoothingEnabled = false; fx.drawImage(pcv, 0, 0, W, H); fx.restore();
}

// ---------------------------------------------------------------- WebGL post (bloom, CA, zoom blur, glitch, pixelate, CRT off, grain, vignette)
const gl = out.getContext("webgl", { preserveDrawingBuffer: true, antialias: false, premultipliedAlpha: false });
const VS = "attribute vec2 p; varying vec2 v; void main(){ v = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }";
const COMMON = `precision highp float; varying vec2 v;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
`;
const FS_BRIGHT = COMMON + `
uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uThr;
void main(){
  vec3 c = vec3(0.0);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) c += texture2D(uSrc, v + vec2(float(x), float(y)) * uTexel).rgb;
  c /= 9.0;
  float l = dot(c, vec3(0.3, 0.59, 0.11));
  gl_FragColor = vec4(c * smoothstep(uThr, uThr + 0.25, l), 1.0);
}`;
const FS_BLUR = COMMON + `
uniform sampler2D uSrc; uniform vec2 uDir;
void main(){
  vec3 c = texture2D(uSrc, v).rgb * 0.2270270;
  c += (texture2D(uSrc, v + uDir * 1.3846153).rgb + texture2D(uSrc, v - uDir * 1.3846153).rgb) * 0.3162162;
  c += (texture2D(uSrc, v + uDir * 3.2307692).rgb + texture2D(uSrc, v - uDir * 3.2307692).rgb) * 0.0702702;
  gl_FragColor = vec4(c, 1.0);
}`;
const FS_FINAL = COMMON + `
uniform sampler2D uScene, uB1, uB2; uniform vec2 uShake, uZC; uniform vec3 uFlashCol;
uniform float uCA, uZoomBlur, uFade, uFrame, uGlitch, uPix, uCRT, uFlash, uBloom, uVig;
void main(){
  vec2 uv = v;
  // CRT power-off: squeeze to a horizontal line, then to a dot
  float sy = mix(1.0, 0.0035, smoothstep(0.0, 0.5, uCRT)), sx = mix(1.0, 0.002, smoothstep(0.45, 0.85, uCRT));
  vec2 dd = max(abs(uv - 0.5) - 0.5 * vec2(sx, sy), 0.0);
  float inside = step(length(dd), 0.0);
  float crtGlow = uCRT > 0.0 ? exp(-length(dd * vec2(1.7778, 1.0)) * 70.0) * smoothstep(0.15, 0.5, uCRT) * (1.0 - smoothstep(0.85, 1.0, uCRT)) : 0.0;
  if (uCRT > 0.0) uv = (uv - 0.5) / vec2(sx, sy) + 0.5;
  if (uPix > 1.0) { vec2 res = vec2(1920.0, 1080.0) / uPix; uv = (floor(uv * res) + 0.5) / res; }
  if (uGlitch > 0.0) {
    float row = floor(uv.y * 23.0 + hash(vec2(uFrame, 3.0)) * 7.0);
    if (hash(vec2(row, uFrame)) > 0.5) uv.x += (hash(vec2(row * 1.3, uFrame + 7.0)) - 0.5) * 0.14 * uGlitch;
  }
  uv += uShake;
  vec2 d = uv - uZC;
  vec2 o = (uv - 0.5) * uCA + vec2(0.011 * uGlitch, 0.0);
  vec3 col;
  if (uZoomBlur > 0.0005) {
    col = vec3(0.0);
    for (int i = 0; i < 16; i++) {
      float f = float(i) / 15.0; vec2 q = uZC + d * (1.0 - uZoomBlur * f);
      col += vec3(texture2D(uScene, q + o).r, texture2D(uScene, q).g, texture2D(uScene, q - o).b);
    }
    col /= 16.0;
  } else {
    col = vec3(texture2D(uScene, uv + o).r, texture2D(uScene, uv).g, texture2D(uScene, uv - o).b);
  }
  col += (texture2D(uB1, uv).rgb * 0.55 + texture2D(uB2, uv).rgb * 0.85) * uBloom;
  col += uFlash * uFlashCol;
  col = col / (1.0 + max(col - 0.85, 0.0) * 0.9);
  if (uCRT > 0.0) col = inside * col * (1.0 + 1.6 * smoothstep(0.1, 0.5, uCRT)) + crtGlow * vec3(0.92, 0.96, 1.0);
  vec2 dv = v - 0.5;
  float vig = smoothstep(1.05, 0.28, length(dv * vec2(1.0, 0.82)));
  col *= mix(uVig, 1.0, vig);
  float l = dot(col, vec3(0.3, 0.59, 0.11));
  float g = hash(floor(v * vec2(1920.0, 1080.0)) + vec2(fract(uFrame * 0.6180339) * 311.0, fract(uFrame * 0.4142135) * 173.0)) - 0.5;
  col += g * 0.055 * (0.6 + 0.4 * (1.0 - l));
  gl_FragColor = vec4(clamp(col, 0.0, 1.0) * uFade, 1.0);
}`;
function prog(fs) {
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "p"); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
function tex(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (w) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return t;
}
function target(w, h) { const t = tex(w, h), f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f, w, h }; }
const P = { bright: prog(FS_BRIGHT), blur: prog(FS_BLUR), final: prog(FS_FINAL) };
const fgTex = tex();
const RT = { a1: target(480, 270), b1: target(480, 270), a2: target(240, 135), b2: target(240, 135) };
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
function pass(pr, rt, texs, uni) {
  gl.useProgram(pr.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, rt ? rt.f : null);
  gl.viewport(0, 0, rt ? rt.w : W, rt ? rt.h : H);
  let unit = 0;
  for (const [name, t] of Object.entries(texs)) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(pr.u[name], unit); unit++; }
  for (const [name, val] of Object.entries(uni)) {
    if (!pr.u[name]) continue;
    if (Array.isArray(val)) (val.length === 3 ? gl.uniform3f : gl.uniform2f).call(gl, pr.u[name], ...val); else gl.uniform1f(pr.u[name], val);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function blur(src, mid, dst, spread) {
  pass(P.blur, mid, { uSrc: src.t }, { uDir: [spread / src.w, 0] });
  pass(P.blur, dst, { uSrc: mid.t }, { uDir: [0, spread / src.h] });
}

// ---------------------------------------------------------------- scene (2D) and post state, pure functions of t
function drawScene(t) {
  fx.setTransform(1, 0, 0, 1, 0, 0); fx.globalCompositeOperation = "source-over"; fx.globalAlpha = 1;
  fx.fillStyle = "#000"; fx.fillRect(0, 0, W, H);
  // 5 + 13: darkness, heartbeat
  if (t < R.diorama.start + 1.2 || inRow(R.black, t)) drawDark(t);
  // 6: the darkness opens on the snowy diorama
  if (inRow(R.diorama, t)) {
    const r = R.diorama, u = (t - r.start) / r.len;
    eyeOpen(t, r.start, 1.05, (op) => {
      drawClip(r, t, { scale: 1.16 - 0.16 * easeOut(u), alpha: 0.35 + 0.65 * op });
      drawSnow(t, op);
    });
    drawCaption(t, r.start + 0.8, end(r) - 0.1, [["KAHRAMANMARAŞ, TÜRKİYE", 52, PAL.fg], ["37.58°K  36.93°D  ·  2023", 40, PAL.amber]]);
  }
  // 8: Kahramanmaraş minigame; whips out at the end
  if (inRow(R.kahr_mini, t, 0, 0.05)) {
    const r = R.kahr_mini, wo = smooth(end(r) - 0.32, end(r), t);
    drawClip(r, t, { scale: (1.05 - 0.05 * easeOut((t - r.start) / 0.35)) * (1 - 0.45 * wo * wo), alpha: 1 - wo });
  }
  // 9: globe spins in (zoom-blur whip), crossfades into the lock clip
  if (inRow(R.globe, t, 0.15, 0.3)) {
    const r = R.globe, wi = easeOut((t - r.start + 0.15) / 0.65);
    drawClip(r, t, { scale: 1 + 0.45 * (1 - wi), alpha: clamp((t - r.start + 0.15) / 0.2) });
  }
  // 10: lock on the Indian Ocean, reticle, zoom into the target
  if (inRow(R.lock, t)) {
    const r = R.lock, S = lockState(t);
    drawClip(r, t, { alpha: smooth(r.start - 0.05, r.start + 0.3, t), scale: S.zoom, cx: r.target[0], cy: r.target[1] });
    drawReticle(t);
  }
  // 11: dark water + MÜDAHALE ET
  if (inRow(R.c_mudahale, t)) drawDeep(t);
  // 12: Indian Ocean minigame (hard cut to black after)
  if (inRow(R.io_mini, t)) drawClip(R.io_mini, t, { scale: 1.05 - 0.05 * easeOut((t - R.io_mini.start) / 0.35) });
  // 14: menu opens like the eye again
  if (inRow(R.menu, t)) {
    const r = R.menu, wo = smooth(end(r) - 0.25, end(r), t);
    eyeOpen(t, r.start, 0.8, (op) => drawClip(r, t, { scale: (1.05 - 0.05 * easeOut((t - r.start) / r.len)) * (1 - 0.3 * wo * wo), alpha: (0.35 + 0.65 * op) * (1 - wo), dy: -70 }));
  }
  // 15/16: second spin (ends in a pixelate transition into the bunny)
  if (inRow(R.globe2, t)) { const r = R.globe2; drawClip(r, t, { scale: 0.98 - 0.1 * easeOut((t - r.start) / 0.6) + 0.04 * smooth(r.start + 1.5, end(r), t), dy: -95 }); }   // lifted: the lines sit under the globe
  // 17: bunny
  if (inRow(R.bunny, t)) drawBunnyScene(t);
  // 19: result card, then it sinks into the dark behind FARK ET
  if (inRow(R.result, t, 0, R.c_fark.len)) {
    const r = R.result, dim = smooth(end(r) - 0.35, end(r) + 0.2, t);
    drawClip(r, t, { scale: 1.0 + 0.12 * smooth(r.start, end(r) + 1.5, t), cy: 972, alpha: lerp(1, 0.08, dim) });   // push anchored on the closing line
  }
  // text
  drawLine(R.s_hayat, t, { y: 568, px: 84 });
  drawCard(R.c_tahmin, t, { scrim: 0.92 });
  drawCard(R.c_kesfet, t, { scrim: 0.6 });
  drawCard(R.c_mudahale, t, { y: 600 });
  drawLine(R.s_fark, t, { y: 985, px: 84, scrim: 0.85, cursorHold: 0.6 });
  drawCard(R.c_tercih, t, { scrim: 0.85 });
  drawLine(R.s_dunya, t, { y: 890, px: 76, scrim: 0.85, cursorHold: 0.3 });
  drawLine(R.s_count, t, { y: 1005, px: 84, hlScale: 1.5 });
  drawLine(R.s_easter, t, { y: 985, px: 76, cursorHold: 0.8 });
  drawCard(R.c_fark, t, { y: 610, px: 210, noOut: true, rule: 300 });
}
function postState(t) {
  const P = { shake: [0, 0], ca: 0.0012, zb: 0, zc: [0.5, 0.5], glitch: 0, pix: 1, crt: 0, flash: 0, flashCol: [0.6, 0.95, 0.9], bloom: 1, vig: 0.28, fade: 1, thr: 0.8 };
  // heartbeat: the vignette tightens on each beat
  P.vig = 0.28 - 0.12 * heartEnv(t);
  // glitch cuts
  for (const c of CUTS) { const f = frameOf(t - c + 2 / FPS); if (t >= c - 2 / FPS && f < 7) P.glitch = [0.6, 1, 0.8, 1, 0.5, 0.25, 0.1][f]; }
  // eye-open bloom + slight CA as the lids part
  for (const [t0, d] of [[R.diorama.start, 1.05], [R.menu.start, 0.8]]) { const u = (t - t0) / d; if (u > 0 && u < 1.2) P.ca += 0.006 * Math.sin(Math.PI * clamp(u)); }
  // whip from the minigame to the globe
  const wk = smooth(end(R.kahr_mini) - 0.3, end(R.kahr_mini), t) * (1 - smooth(R.globe.start, R.globe.start + 0.5, t));
  P.zb = Math.max(P.zb, 0.22 * wk);
  const wm = smooth(end(R.menu) - 0.25, end(R.menu), t) * (t < end(R.menu) ? 1 : 0);
  P.zb = Math.max(P.zb, 0.18 * wm);
  // lock zoom: zoom blur toward the target, teal flash into MÜDAHALE ET
  if (inRow(R.lock, t)) {
    const S = lockState(t);
    P.zb = Math.max(P.zb, 0.3 * smooth(0.1, 1, S.z));
    P.zc = [R.lock.target[0] / W, 1 - R.lock.target[1] / H];
    P.ca += 0.006 * S.z;
    if (S.locked) { const k = Math.exp(-(S.u - R.lock.lock) * 10); P.shake = [3 * k * vnoise(t * 40) / W, 3 * k * vnoise(t * 37 + 9) / H]; P.flash = 0.06 * k; P.flashCol = [1.0, 0.45, 0.3]; }
  }
  const fe = t < end(R.lock) ? smooth(end(R.lock) - 0.35, end(R.lock), t) : Math.exp(-(t - end(R.lock)) * 4.5);
  if (t > end(R.lock) - 0.35 && t < R.c_mudahale.start + 1.2) { P.flash = Math.max(P.flash, 0.42 * fe); P.flashCol = [0.62, 0.95, 0.9]; }
  // pixelate: globe -> bunny (pixel world)
  const g2 = end(R.globe2);
  if (t >= g2 - 0.4 && t < g2) P.pix = Math.round(lerp(1, 40, easeIn((t - g2 + 0.4) / 0.4))) || 1;
  if (t >= g2 && t < g2 + 0.35) P.pix = Math.max(1, Math.round(lerp(40, 1, easeOut((t - g2) / 0.35))));
  if (P.pix > 1 && P.pix < 2) P.pix = 1;
  // end: CRT power-off on FARK ET, then black
  const c0 = end(R.c_fark) - 0.7;
  if (t >= c0) P.crt = clamp((t - c0) / 0.62);
  if (t >= end(R.c_fark)) P.fade = 0;
  return P;
}

// ---------------------------------------------------------------- frame
async function renderAt(t) {
  await prefetch(t);
  drawScene(t);
  const S = postState(t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.bindTexture(gl.TEXTURE_2D, fgTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, fg);
  const scene = { t: fgTex, w: W, h: H };
  pass(P.bright, RT.a1, { uSrc: scene.t }, { uTexel: [1 / W * 2, 1 / H * 2], uThr: S.thr });
  blur(RT.a1, RT.b1, RT.a1, 1.6);
  blur(RT.a1, RT.b1, RT.a1, 3.0);
  pass(P.blur, RT.a2, { uSrc: RT.a1.t }, { uDir: [0, 0] });
  blur(RT.a2, RT.b2, RT.a2, 2.0);
  blur(RT.a2, RT.b2, RT.a2, 4.0);
  pass(P.final, null, { uScene: fgTex, uB1: RT.a1.t, uB2: RT.a2.t }, {
    uShake: S.shake, uZC: S.zc, uCA: S.ca, uZoomBlur: S.zb, uFade: S.fade, uFrame: Math.round(t * FPS), uGlitch: S.glitch,
    uPix: S.pix, uCRT: S.crt, uFlash: S.flash, uFlashCol: S.flashCol, uBloom: S.bloom, uVig: S.vig,
  });
  gl.finish();
  return Math.round(t * FPS);
}

// ---------------------------------------------------------------- cue sheet for the audio team (final-film seconds = INTRO_LEN + film seconds)
function cues() {
  const c = HEART.map(([t], i) => ({ film: t, what: `heartbeat (${i % 2 ? "dub" : "lub"})` }));
  c.push({ film: R.diorama.start, what: "darkness tears open: snowy Kahramanmaraş diorama" }, { film: R.black.start, what: "hard cut to black" },
    { film: R.menu.start, what: "menu opens (eye again)" }, { film: end(R.globe2) - 0.4, what: "pixelate into the bunny scene" },
    { film: R.globe.start - 0.3, what: "zoom-blur whip to the globe" }, { film: R.lock.start + R.lock.lock, what: "target lock (Indian Ocean)" });
  c.push({ film: VOICE.t, len: VOICE.len, what: `voice, echoing: "${VOICE.text}"` });
  for (const r of TL) if (r.text) c.push({ film: r.start, len: r.len, what: `${r.id.startsWith("c_") ? "title card" : "statement"}: ${r.text.replace(/\*/g, "")}` });
  for (const t of CUTS) c.push({ film: t, what: "glitch cut" });
  c.push({ film: end(R.lock) - 0.35, what: "zoom flash into the ocean" });
  c.push({ film: R.bunny.start + 1.4, what: "egg bursts, bunny pops out" });
  c.push({ film: end(R.c_fark) - 0.7, what: "CRT power-off" }, { film: end(R.c_fark), what: "black" });
  return c.map((x) => ({ ...x, final: +(x.film + INTRO_LEN).toFixed(2) })).sort((a, b) => a.film - b.film);
}

// ---------------------------------------------------------------- boot
window.SEGMENT = { name: "film", fps: FPS, duration: DURATION, frames: Math.round(DURATION * FPS), cues: cues() };
(async () => {
  for (const name of new Set(TL.filter((r) => r.clip).map((r) => r.clip))) CLIPS[name] = await probeClip(name);
  window.SEGMENT.clips = Object.fromEntries(Object.entries(CLIPS).map(([k, v]) => [k, v ? v.frames : "PLACEHOLDER"]));
  await document.fonts.load("172px VT323");
  window.renderAt = renderAt;
  await renderAt(Q.has("t") ? parseFloat(Q.get("t")) : 0);
  document.documentElement.dataset.ready = "1";
})().catch((e) => { document.documentElement.dataset.error = String(e); console.error(e); });
</script>
