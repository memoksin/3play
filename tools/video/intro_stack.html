<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>intro_stack</title>
<!--
  Pitch video segment "intro_stack": Stack logo in a storm -> lightning hurts it -> STACK PRESENTS -> push into black.
  Frame-exact: everything is a pure function of t (seconds). window.renderAt(t) draws one frame; frame N = renderAt(N / 60).
  No requestAnimationFrame state, no wall clock, randomness only from a seeded PRNG built once at load.
  Render: node tools/video/render.mjs intro_stack   (served over a local http server so WebGL can read the images)
  Preview a still in a browser: intro_stack.html?t=3.2
-->
<style>
  @font-face { font-family: "VT323"; src: url("../../assets/fonts/VT323-Regular.ttf"); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src="logo_align.js"></script>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
"use strict";
// ---------------------------------------------------------------- config
const W = 1920, H = 1080, FPS = 60;
const DURATION = 6.5;                       // 390 frames; last 15 frames are pure black
const HURT_VARIANT = "hurt";                // "hurt" (keeps syrup + butter, morphs best) or "hurt_alt"
const HURT_SRC = { hurt: "../../assets/video/stack_logo_hurt_key.png", hurt_alt: "../../assets/video/stack_logo_hurt_alt_key.png" };
const IMG = 1254;                           // source logo size (px)
const LOGO_PX = 700;                        // on-screen size of the 1254 px source
const K = LOGO_PX / IMG;
const CX = 960, CY = 425;                   // logo centre on screen
const ALIGN = window.LOGO_ALIGN[HURT_VARIANT];
const EYE_SRC = HURT_VARIANT === "hurt" ? [466, 541] : [473, 537];   // dark lower half of the left pupil (hurt image px)

// timeline (seconds)
const T_FADE_IN = 0.45;
const T_SHEET = 0.85;                        // distant sheet lightning (clouds only), foreshadowing
const STRIKES = [
  { t: 1.32, s: 0.80, x0: 560, y0: -60, x1: 250, y1: 1100, seed: 11, side: -1, width: 1.0 },
  { t: 1.90, s: 0.95, x0: 1380, y0: -60, x1: 1700, y1: 1100, seed: 23, side: 1, width: 1.1 },
  { t: 2.42, s: 1.35, x0: 700, y0: -80, x1: 955, y1: 160, seed: 37, side: 0, width: 1.6, final: true },
  { t: 3.98, s: 0.45, x0: 1560, y0: -40, x1: 1700, y1: 640, seed: 51, side: 1, width: 0.6, far: true },
];
const T_HURT = STRIKES[2].t;                 // after this frame the logo stays hurt
const TEXT = "STACK PRESENTS";
const T_TEXT = 2.95, TEXT_STEP = 0.058;
const T_PUSH0 = 4.55, T_PUSH1 = 6.15;        // push into the eye
const T_BLACK = 6.25;                        // pure black from here (frame 375..389)

// ---------------------------------------------------------------- helpers
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const hash1 = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u) * 2 - 1; }
const frameOf = (dt) => Math.floor(dt * FPS + 1e-6);

// ---------------------------------------------------------------- lightning geometry (seeded, built once)
function displace(rng, a, b, depth, rough) {
  let pts = [a, b];
  let d = Math.hypot(b[0] - a[0], b[1] - a[1]) * rough;
  for (let g = 0; g < depth; g++) {
    const np = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const p = pts[i], q = pts[i + 1];
      const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1;
      const off = (rng() - 0.5) * 2 * d, along = (rng() - 0.5) * 0.2;
      np.push([(p[0] + q[0]) / 2 - dy / L * off + dx * along, (p[1] + q[1]) / 2 + dx / L * off + dy * along]);
      np.push(q);
    }
    pts = np; d *= 0.52;
  }
  return pts;
}
function buildBolt(st) {
  const rng = mulberry32(st.seed * 7919);
  const main = displace(rng, [st.x0, st.y0], [st.x1, st.y1], 8, 0.16);
  const paths = [{ pts: main, w: 1, a: 1 }];
  const Lmain = Math.hypot(st.x1 - st.x0, st.y1 - st.y0);
  const nb = st.far ? 3 : 6;
  for (let b = 0; b < nb; b++) {
    const i0 = Math.floor(main.length * (0.12 + 0.62 * rng()));
    const p = main[i0], q = main[Math.min(main.length - 1, i0 + 8)];
    let ang = Math.atan2(q[1] - p[1], q[0] - p[0]) + (rng() < 0.5 ? -1 : 1) * (0.35 + 0.6 * rng());
    const len = Lmain * (0.12 + 0.22 * rng());
    const end = [p[0] + Math.cos(ang) * len, p[1] + Math.sin(ang) * len];
    const br = displace(rng, p, end, 6, 0.2);
    paths.push({ pts: br, w: 0.5, a: 0.75, start: i0 / main.length });
    if (rng() < 0.6) {
      const j = Math.floor(br.length * (0.3 + 0.4 * rng())), p2 = br[j];
      ang += (rng() < 0.5 ? -1 : 1) * (0.4 + 0.5 * rng());
      const end2 = [p2[0] + Math.cos(ang) * len * 0.45, p2[1] + Math.sin(ang) * len * 0.45];
      paths.push({ pts: displace(rng, p2, end2, 5, 0.22), w: 0.3, a: 0.55, start: i0 / main.length + 0.05 });
    }
  }
  return paths;
}
const BOLTS = STRIKES.map(buildBolt);

// bolt visibility per frame after the strike (leader frames draw partially), flash envelope per frame
const BOLT_I = [1, 1, 0.35, 1, 0.85, 0.25, 0.75, 0.5, 0.15, 0.4, 0.15, 0.06];
const FLASH_I = [1, 0.5, 1, 0.8, 0.3, 0.65, 0.2, 0.35];
function boltI(st, t) {
  const dt = t - st.t; if (dt < -2 / FPS) return 0;
  if (dt < 0) return 0.6;                       // leader frames (stepped leader creeping down)
  const f = frameOf(dt); return f < BOLT_I.length ? BOLT_I[f] : 0;
}
function leaderFrac(st, t) { const dt = t - st.t; if (dt >= 0) return 1; return dt < -1.5 / FPS ? 0.45 : 0.8; }
function flashEnv(st, t) {
  const dt = t - st.t; if (dt < 0) return 0;
  const f = frameOf(dt); if (f < FLASH_I.length) return FLASH_I[f];
  return 0.3 * Math.exp(-(dt - FLASH_I.length / FPS) * 7);
}

// ---------------------------------------------------------------- rain (seeded)
const RAIN = (() => { const r = mulberry32(4242), a = []; for (let i = 0; i < 520; i++) a.push({ x: r() * (W + 400) - 200, y: r() * H, sp: 1700 + r() * 1300, len: 22 + r() * 46, z: r() }); return a; })();

// ---------------------------------------------------------------- canvases
const out = document.getElementById("out");
const fg = document.createElement("canvas"); fg.width = W; fg.height = H;
const lay = document.createElement("canvas"); lay.width = W; lay.height = H;
const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H;
const fx = fg.getContext("2d"), lx = lay.getContext("2d"), tx = tmp.getContext("2d");
for (const c of [fx, lx, tx]) { c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high"; }

// ---------------------------------------------------------------- per-frame state (pure functions of t)
function state(t) {
  const S = {};
  // hurt amount: flickers on strikes 1 and 2, stays hurt from the final strike
  let h = 0;
  const d1 = t - STRIKES[0].t, d2 = t - STRIKES[1].t;
  if (d1 >= 0 && frameOf(d1) >= 1 && frameOf(d1) <= 4) h = 1;
  const P2 = [0, 1, 1, 0, 1, 1, 1, 0, 1, 0, 0, 1, 0];
  if (d2 >= 0 && frameOf(d2) < P2.length) h = P2[frameOf(d2)];
  if (t >= T_HURT) h = 1;
  S.h = h;
  // flashes
  let flash = 0, fxPos = 0.5, best = 0, shake = [0, 0], ca = 0, sq = 0, side = 0;
  for (const st of STRIKES) {
    const e = flashEnv(st, t) * st.s;
    flash += e;
    if (e > best) { best = e; fxPos = st.x1 / W; side = st.side; }
    const dt = t - st.t;
    if (dt >= 0 && !st.far) {
      const k = st.s * Math.exp(-dt * 7.5);
      shake[0] += k * 26 * vnoise(dt * 38 + st.seed);
      shake[1] += k * 20 * vnoise(dt * 41 + st.seed * 3.1);
      ca += st.s * Math.exp(-dt * 6) * 0.012;
      sq += st.s * Math.exp(-dt * 9) * Math.cos(dt * 34) * (st.final ? 0.11 : 0.045);
    }
  }
  S.flash = flash; S.flashX = fxPos; S.side = side; S.shake = shake; S.sq = sq;
  S.sheet = T_SHEET <= t ? 0.55 * Math.exp(-(t - T_SHEET) * 9) * (0.6 + 0.4 * Math.cos((t - T_SHEET) * 70)) : 0;
  // impact frames on the final strike: 2 frames silhouette, 1 frame inverted
  const df = t - STRIKES[2].t;
  S.impact = df >= 0 && df < 2 / FPS ? 1 : (df >= 2 / FPS && df < 3 / FPS ? 2 : 0);
  // push-in
  const pu = clamp((t - T_PUSH0) / (T_PUSH1 - T_PUSH0));
  S.push = pu;
  const e = pu * pu * pu;                       // ease-in
  S.zoom = Math.exp(Math.log(70) * e) * (1 + 0.035 * clamp(t / T_PUSH0));   // slow dolly-in, then the push
  S.center = smooth(0, 0.6, pu);
  S.zoomBlur = 0.11 * smooth(0.15, 0.9, pu);
  ca += 0.004 * smooth(0.2, 1, pu) + 0.0012;
  S.ca = ca;
  S.fade = Math.min(smooth(0, T_FADE_IN, t), 1 - smooth(T_PUSH0 + 1.3, T_BLACK - 0.03, t));
  if (t >= T_BLACK) S.fade = 0;
  return S;
}

// ---------------------------------------------------------------- logo
// logo local space (image drawn centred at 0,0, LOGO_PX wide) -> screen, before the camera
function logoMatrix(t, S, hurt) {
  const m = new DOMMatrix();
  const baseY = CY + 0.36 * LOGO_PX;            // pivot at the base of the stack
  m.translateSelf(CX, baseY);
  // healthy idle breathing / hurt slump + tremble
  const br = 1 + 0.014 * Math.sin(t * 2 * Math.PI / 1.7);
  let sx = br, sy = br + 0.006 * Math.sin(t * 2 * Math.PI / 1.7 + 0.6), rot = 0, jx = 0, jy = 0;
  if (hurt) {
    const since = clamp((t - T_HURT) / 0.5);
    sx = lerp(1, 1.03, since); sy = lerp(1, 0.965, since);
    rot = -0.022 * since;
    const tr = t > T_HURT ? 1 : 0.6;
    jx = 2.6 * tr * vnoise(t * 23 + 5); jy = 1.6 * tr * vnoise(t * 19 + 40);
    sy += 0.006 * Math.sin(t * 2 * Math.PI / 2.4);
  }
  sx *= 1 + S.sq; sy *= 1 - S.sq;
  m.translateSelf(jx, jy); m.rotateSelf(rot * 180 / Math.PI); m.scaleSelf(sx, sy);
  m.translateSelf(0, CY - baseY);
  if (hurt) { m.translateSelf(ALIGN.dx * K, ALIGN.dy * K); m.scaleSelf(ALIGN.scale, ALIGN.scale); }
  return m;
}
// the camera pushes into the left pupil of the hurt logo: track it exactly, frame by frame
function eyeScreen(t, S) {
  const p = logoMatrix(t, S, true).transformPoint(new DOMPoint(-LOGO_PX / 2 + EYE_SRC[0] * K, -LOGO_PX / 2 + EYE_SRC[1] * K));
  return [p.x, p.y];
}
function cameraTransform(c, S) {
  const E = S.E;
  c.translate(E[0] + (W / 2 - E[0]) * S.center, E[1] + (H / 2 - E[1]) * S.center);
  c.scale(S.zoom, S.zoom);
  c.translate(-E[0], -E[1]);
}
function drawLogoBody(c, t, S, img, hurt) {
  c.save();
  cameraTransform(c, S);
  c.transform(...(({ a, b, c: cc, d, e, f }) => [a, b, cc, d, e, f])(logoMatrix(t, S, hurt)));
  c.drawImage(img, -LOGO_PX / 2, -LOGO_PX / 2, LOGO_PX, LOGO_PX);
  c.restore();
}
function rim(color, ox, oy, alpha) {               // lit edge band inside the silhouette in `lay`
  tx.globalCompositeOperation = "copy"; tx.globalAlpha = 1; tx.drawImage(lay, 0, 0);
  tx.globalCompositeOperation = "source-in"; tx.fillStyle = color; tx.fillRect(0, 0, W, H);
  tx.globalCompositeOperation = "destination-out"; tx.drawImage(lay, ox, oy);
  tx.globalCompositeOperation = "destination-out"; tx.drawImage(lay, ox * 0.5, oy * 0.5);
  tx.globalCompositeOperation = "source-over";
  lx.globalCompositeOperation = "lighter"; lx.globalAlpha = alpha; lx.drawImage(tmp, 0, 0);
  lx.globalCompositeOperation = "source-over"; lx.globalAlpha = 1;
}
function drawLogo(t, S) {
  lx.setTransform(1, 0, 0, 1, 0, 0); lx.globalCompositeOperation = "source-over"; lx.globalAlpha = 1;
  lx.clearRect(0, 0, W, H);
  if (S.h < 1) drawLogoBody(lx, t, S, IMAGES.healthy, false);
  if (S.h > 0) { lx.globalAlpha = S.h; drawLogoBody(lx, t, S, IMAGES.hurt, true); lx.globalAlpha = 1; }
  const z = Math.min(S.zoom, 3);
  // night ambience: cool, a little darker (less once hurt is lit by storm)
  lx.globalCompositeOperation = "source-atop";
  lx.fillStyle = `rgba(28,22,78,${0.30 * (1 - 0.6 * clamp(S.flash))})`; lx.fillRect(0, 0, W, H);
  lx.globalCompositeOperation = "source-over";
  // warm rim (healthy idle, breathing) / cold moon rim (hurt)
  const pulse = 0.75 + 0.25 * Math.sin(t * 2 * Math.PI / 1.7);
  if (S.h < 1) rim("rgb(255,170,70)", -9 * z, 8 * z, 0.75 * pulse * (1 - S.h));
  else rim("rgb(120,140,255)", -7 * z, 7 * z, 0.45);
  // lightning side light
  if (S.flash > 0.02) {
    const f = clamp(S.flash, 0, 1);
    let g;
    if (S.side < 0) g = lx.createLinearGradient(CX - 380, 0, CX + 380, 0);
    else if (S.side > 0) g = lx.createLinearGradient(CX + 380, 0, CX - 380, 0);
    else g = lx.createLinearGradient(0, CY - 360, 0, CY + 360);
    g.addColorStop(0, `rgba(210,222,255,${0.3 * f})`); g.addColorStop(0.55, `rgba(160,170,255,${0.08 * f})`); g.addColorStop(1, "rgba(160,170,255,0)");
    tx.globalCompositeOperation = "copy"; tx.drawImage(lay, 0, 0);
    tx.globalCompositeOperation = "source-in"; tx.fillStyle = g; tx.fillRect(0, 0, W, H);
    tx.globalCompositeOperation = "source-over";
    lx.globalCompositeOperation = "lighter"; lx.drawImage(tmp, 0, 0); lx.globalCompositeOperation = "source-over";
    const ox = S.side === 0 ? 0 : -S.side * 14, oy = S.side === 0 ? 14 : 4;
    rim("rgb(225,232,255)", ox, oy, 0.85 * clamp(f));
  }
  fx.drawImage(lay, 0, 0);
}

// ---------------------------------------------------------------- bolts
function strokePath(c, pts, n) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < n; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.stroke();
}
function drawBolt(st, paths, t) {
  const I = boltI(st, t); if (I <= 0) return;
  const frac = leaderFrac(st, t);
  const k = st.width;
  fx.save(); fx.globalCompositeOperation = "lighter"; fx.lineJoin = "round"; fx.lineCap = "round";
  const passes = [[46, "rgba(90,90,255,", 0.05], [22, "rgba(130,140,255,", 0.13], [9, "rgba(180,195,255,", 0.35], [3.2, "rgba(245,248,255,", 1]];
  for (const p of paths) {
    const start = p.start || 0; if (start > frac) continue;
    const n = Math.max(2, Math.floor(p.pts.length * clamp((frac - start) / (1 - start + 1e-6))));
    for (const [w, col, a] of passes) {
      fx.lineWidth = w * k * (0.35 + 0.65 * p.w); fx.strokeStyle = col + (a * I * p.a) + ")";
      strokePath(fx, p.pts, n);
    }
  }
  // strike point glow
  if (frac >= 1 && !st.far) {
    const g = fx.createRadialGradient(st.x1, st.y1, 0, st.x1, st.y1, 220 * k);
    g.addColorStop(0, `rgba(235,240,255,${0.9 * I})`); g.addColorStop(0.2, `rgba(150,160,255,${0.35 * I})`); g.addColorStop(1, "rgba(80,80,255,0)");
    fx.fillStyle = g; fx.fillRect(st.x1 - 240 * k, st.y1 - 240 * k, 480 * k, 480 * k);
  }
  fx.restore();
}

// ---------------------------------------------------------------- rain
function drawRain(t, S, front) {
  fx.save(); fx.lineCap = "round";
  const lit = 1 + 3 * clamp(S.flash);
  const vis = smooth(0.4, 1.3, t);                // rain thickens as the storm arrives
  for (let i = 0; i < RAIN.length; i++) {
    const r = RAIN[i]; const isFront = r.z > 0.82; if (isFront !== front) continue;
    if (i % 3 === 0 && t < 1.3) continue;
    const y = ((r.y + r.sp * t) % (H + 200)) - 100, x = r.x - 0.18 * (y + 100);
    const L = r.len * (isFront ? 1.7 : 1);
    fx.strokeStyle = `rgba(170,180,255,${(isFront ? 0.13 : 0.07 + 0.06 * r.z) * lit * vis})`;
    fx.lineWidth = isFront ? 2.2 : 1 + r.z;
    fx.beginPath(); fx.moveTo(x, y); fx.lineTo(x - 0.18 * L, y + L); fx.stroke();
  }
  fx.restore();
}

// ---------------------------------------------------------------- text
const TEXT_PX = 172, TRACK = 0.12;
let TEXT_X = [];
function layoutText() {
  fx.font = `${TEXT_PX}px VT323`;
  const ws = [...TEXT].map((ch) => fx.measureText(ch).width + TEXT_PX * TRACK);
  const total = ws.reduce((a, b) => a + b, 0) - TEXT_PX * TRACK;
  let x = W / 2 - total / 2; TEXT_X = ws.map((w) => { const x0 = x; x += w; return x0; });
}
function drawText(t, S) {
  if (t < T_TEXT) return;
  const out = smooth(T_PUSH0, T_PUSH0 + 0.45, t);
  if (out >= 1) return;
  fx.save();
  fx.font = `${TEXT_PX}px VT323`; fx.textBaseline = "alphabetic";
  const baseY = 990;
  const spread = 1 + 0.5 * out * out;           // letters fly apart as the camera pushes in
  let li = 0, lastEnd = 0, lastAge = 0, shown = 0;
  for (let i = 0; i < TEXT.length; i++) {
    const ch = TEXT[i]; if (ch === " ") continue;
    const ti = T_TEXT + li * TEXT_STEP + (i > 5 ? 0.12 : 0); li++;
    const a = t - ti; if (a < 0) continue;
    const warm = i < 5;
    const x = W / 2 + (TEXT_X[i] - W / 2) * spread;
    const g = clamp(1 - a / 0.16);                // glitch amount
    const f = frameOf(a);
    const gx = g * 22 * (hash1(i * 13 + f * 7) - 0.5), gy = g * 10 * (hash1(i * 31 + f * 3) - 0.5);
    const hot = clamp(1 - a / 0.12);              // white-hot on arrival
    const alpha = (1 - out) * (f === 1 ? 0.35 : 1);
    const col = warm ? [255, 206, 120] : [222, 228, 255];
    const c = col.map((v) => Math.round(lerp(v, 255, hot)));
    // glow
    fx.globalCompositeOperation = "lighter";
    fx.shadowColor = warm ? `rgba(255,140,40,${0.9 * alpha})` : `rgba(120,140,255,${0.9 * alpha})`;
    fx.shadowBlur = 28 + 40 * hot;
    fx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
    fx.fillText(ch, x + gx, baseY + gy);
    fx.shadowBlur = 0;
    // chromatic split while glitching
    if (g > 0) {
      fx.fillStyle = `rgba(255,40,60,${0.7 * g * alpha})`; fx.fillText(ch, x + gx + 9 * g, baseY + gy);
      fx.fillStyle = `rgba(40,200,255,${0.7 * g * alpha})`; fx.fillText(ch, x + gx - 9 * g, baseY + gy);
    }
    lastEnd = x + fx.measureText(ch).width; lastAge = a; shown++;
  }
  // terminal block cursor riding the typing head, then blinking
  const nLetters = TEXT.replace(/ /g, "").length;
  const done = shown === nLetters;
  const blinkOn = !done || Math.floor((t - T_TEXT) * 3.2) % 2 === 0;
  if (shown > 0 && blinkOn && out < 0.5) {
    const cw = TEXT_PX * 0.36, ch = TEXT_PX * 0.62;
    fx.globalCompositeOperation = "lighter";
    fx.shadowColor = "rgba(150,170,255,0.9)"; fx.shadowBlur = 30;
    fx.fillStyle = `rgba(235,240,255,${done ? 0.85 : 0.95})`;
    fx.fillRect(lastEnd + TEXT_PX * 0.1, baseY - ch, cw, ch);
    fx.shadowBlur = 0;
  }
  // lightning re-lights the text
  if (S.flash > 0.05) {
    fx.globalCompositeOperation = "lighter";
    fx.fillStyle = `rgba(200,210,255,${0.35 * clamp(S.flash) * (1 - out)})`;
    li = 0;
    for (let i = 0; i < TEXT.length; i++) if (TEXT[i] !== " ") fx.fillText(TEXT[i], W / 2 + (TEXT_X[i] - W / 2) * spread, baseY);
  }
  // thin rules either side, drawn out after the last letter
  const ru = smooth(T_TEXT + 0.9, T_TEXT + 1.35, t) * (1 - out);
  if (ru > 0) {
    const ext = TEXT_X[0] - 40, L = 260 * ru, y = baseY - TEXT_PX * 0.3;
    const right = TEXT_X[TEXT.length - 1] + fx.measureText("S").width + TEXT_PX * 0.46 + 40;   // past the cursor
    fx.globalCompositeOperation = "lighter";
    fx.fillStyle = `rgba(200,205,255,${0.55 * ru})`;
    fx.fillRect(ext - L, y, L, 2); fx.fillRect(right, y, L, 2);
  }
  fx.restore();
}

// ---------------------------------------------------------------- ground shadow
function drawGround(t, S) {
  fx.save(); cameraTransform(fx, S);
  const y = CY + 0.4 * LOGO_PX;
  fx.translate(CX, y); fx.scale(1, 0.16);
  const g = fx.createRadialGradient(0, 0, 0, 0, 0, 420);
  g.addColorStop(0, "rgba(4,2,12,0.75)"); g.addColorStop(1, "rgba(4,2,12,0)");
  fx.fillStyle = g; fx.fillRect(-420, -420, 840, 840);
  fx.restore();
}

// ---------------------------------------------------------------- WebGL post (background clouds, bloom, CA, zoom blur, grain, vignette)
const gl = out.getContext("webgl", { preserveDrawingBuffer: true, antialias: false, premultipliedAlpha: false });
const VS = "attribute vec2 p; varying vec2 v; void main(){ v = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }";
const COMMON = `precision highp float; varying vec2 v;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 6; i++){ s += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s; }
`;
const FS_SCENE = COMMON + `
uniform sampler2D uFg; uniform float uT, uFlash, uFlashX, uSheet, uPush;
void main(){
  vec2 uv = v; vec2 p = vec2(uv.x * 1.7778, uv.y);
  vec3 top = vec3(0.025, 0.022, 0.085), mid = vec3(0.11, 0.065, 0.21), bot = vec3(0.035, 0.02, 0.07);
  vec3 col = mix(bot, mid, smoothstep(0.0, 0.5, uv.y));
  col = mix(col, top, smoothstep(0.5, 1.0, uv.y));
  float c = fbm(p * 1.4 + vec2(uT * 0.035, uT * 0.012));
  float c2 = fbm(p * 3.1 - vec2(uT * 0.06, 0.0) + c * 1.3);
  float cl = smoothstep(0.42, 0.9, c * 0.65 + c2 * 0.55) * smoothstep(0.12, 0.7, uv.y);
  float edge = smoothstep(0.55, 0.95, c2) * cl;
  col = mix(col, vec3(0.17, 0.13, 0.30), cl * 0.65);
  col += vec3(0.10, 0.08, 0.18) * edge * 0.6;
  float near = exp(-pow((uv.x - uFlashX) * 2.4, 2.0));
  col += uFlash * cl * (0.25 + 1.3 * near) * vec3(0.62, 0.68, 1.0);
  col += uFlash * (0.06 + 0.10 * near) * vec3(0.45, 0.5, 0.95);
  col += uSheet * cl * vec3(0.45, 0.42, 0.85) * exp(-pow((uv.x - 0.82) * 2.2, 2.0));
  // low horizon haze
  col += vec3(0.06, 0.03, 0.10) * exp(-uv.y * 6.0);
  vec4 f = texture2D(uFg, uv);
  col = col * (1.0 - f.a) + f.rgb;
  gl_FragColor = vec4(col, f.a);   // alpha = foreground coverage (impact silhouettes)
}`;
const FS_BRIGHT = COMMON + `
uniform sampler2D uSrc; uniform vec2 uTexel;
void main(){
  vec3 c = vec3(0.0);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) c += texture2D(uSrc, v + vec2(float(x), float(y)) * uTexel).rgb;
  c /= 9.0;
  float l = dot(c, vec3(0.3, 0.59, 0.11)) + 0.15 * max(c.b - c.r, 0.0);
  gl_FragColor = vec4(c * smoothstep(0.8, 1.05, l), 1.0);
}`;
const FS_BLUR = COMMON + `
uniform sampler2D uSrc; uniform vec2 uDir;
void main(){
  vec3 c = texture2D(uSrc, v).rgb * 0.2270270;
  c += (texture2D(uSrc, v + uDir * 1.3846153).rgb + texture2D(uSrc, v - uDir * 1.3846153).rgb) * 0.3162162;
  c += (texture2D(uSrc, v + uDir * 3.2307692).rgb + texture2D(uSrc, v - uDir * 3.2307692).rgb) * 0.0702702;
  gl_FragColor = vec4(c, 1.0);
}`;
const FS_FINAL = COMMON + `
uniform sampler2D uScene, uB1, uB2; uniform vec2 uShake; uniform float uCA, uZoomBlur, uFlashScr, uFade, uImpact, uFrame;
void main(){
  vec2 uv = (v - 0.5) / 1.035 + 0.5 + uShake;
  vec2 d = uv - 0.5;
  vec2 o = d * uCA;
  vec3 col;
  if (uZoomBlur > 0.0005) {
    col = vec3(0.0);
    for (int i = 0; i < 14; i++) {
      float f = float(i) / 13.0; vec2 q = 0.5 + d * (1.0 - uZoomBlur * f);
      col += vec3(texture2D(uScene, q + o).r, texture2D(uScene, q).g, texture2D(uScene, q - o).b);
    }
    col /= 14.0;
  } else {
    col = vec3(texture2D(uScene, uv + o).r, texture2D(uScene, uv).g, texture2D(uScene, uv - o).b);
  }
  float cover = texture2D(uScene, uv).a;
  vec3 b1 = texture2D(uB1, uv).rgb, b2 = texture2D(uB2, uv).rgb;
  col += b1 * 0.55 + b2 * 0.85;
  col += uFlashScr * vec3(0.78, 0.82, 1.0);
  // gentle shoulder so flashes bloom out instead of clipping hard
  col = col / (1.0 + max(col - 0.85, 0.0) * 0.9);
  float vig = smoothstep(1.05, 0.28, length(d * vec2(1.0, 0.82)));
  col *= mix(0.28, 1.0, vig);
  float l = dot(col, vec3(0.3, 0.59, 0.11));
  if (uImpact > 0.5 && uImpact < 1.5) col = mix(vec3(1.0, 0.97, 0.92), vec3(0.02, 0.01, 0.06), smoothstep(0.45, 0.6, cover));
  else if (uImpact > 1.5) col = (vec3(1.0) - col) * vec3(0.8, 0.85, 1.0);
  float g = hash(floor(v * vec2(1920.0, 1080.0)) + vec2(fract(uFrame * 0.6180339) * 311.0, fract(uFrame * 0.4142135) * 173.0)) - 0.5;
  col += g * 0.055 * (0.6 + 0.4 * (1.0 - l));
  gl_FragColor = vec4(clamp(col, 0.0, 1.0) * uFade, 1.0);
}`;
function prog(fs) {
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "p"); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
function tex(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (w) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return t;
}
function target(w, h) { const t = tex(w, h), f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f, w, h }; }
const P = { scene: prog(FS_SCENE), bright: prog(FS_BRIGHT), blur: prog(FS_BLUR), final: prog(FS_FINAL) };
const fgTex = tex();
const RT = { scene: target(W, H), a1: target(480, 270), b1: target(480, 270), a2: target(240, 135), b2: target(240, 135) };
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
function pass(pr, rt, texs, uni) {
  gl.useProgram(pr.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, rt ? rt.f : null);
  gl.viewport(0, 0, rt ? rt.w : W, rt ? rt.h : H);
  let unit = 0;
  for (const [name, t] of Object.entries(texs)) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(pr.u[name], unit); unit++; }
  for (const [name, val] of Object.entries(uni)) {
    if (!pr.u[name]) continue;
    if (Array.isArray(val)) gl.uniform2f(pr.u[name], val[0], val[1]); else gl.uniform1f(pr.u[name], val);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function blur(src, mid, dst, spread) {
  pass(P.blur, mid, { uSrc: src.t }, { uDir: [spread / src.w, 0] });
  pass(P.blur, dst, { uSrc: mid.t }, { uDir: [0, spread / src.h] });
}

// ---------------------------------------------------------------- frame
function renderAt(t) {
  const S = state(t);
  S.E = eyeScreen(t, S);
  fx.setTransform(1, 0, 0, 1, 0, 0); fx.globalCompositeOperation = "source-over"; fx.globalAlpha = 1;
  fx.clearRect(0, 0, W, H);
  if (S.fade > 0) {
    drawRain(t, S, false);
    drawBolt(STRIKES[3], BOLTS[3], t);            // far strike sits behind the logo
    drawGround(t, S);
    drawLogo(t, S);
    for (let i = 0; i < 3; i++) drawBolt(STRIKES[i], BOLTS[i], t);
    drawText(t, S);
    drawRain(t, S, true);
  }
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.bindTexture(gl.TEXTURE_2D, fgTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, fg);
  pass(P.scene, RT.scene, { uFg: fgTex }, { uT: t, uFlash: S.flash, uFlashX: S.flashX, uSheet: S.sheet, uPush: S.push });
  pass(P.bright, RT.a1, { uSrc: RT.scene.t }, { uTexel: [1 / W * 2, 1 / H * 2] });
  blur(RT.a1, RT.b1, RT.a1, 1.6);
  blur(RT.a1, RT.b1, RT.a1, 3.0);
  pass(P.blur, RT.a2, { uSrc: RT.a1.t }, { uDir: [0, 0] });
  blur(RT.a2, RT.b2, RT.a2, 2.0);
  blur(RT.a2, RT.b2, RT.a2, 4.0);
  const sh = S.shake;
  pass(P.final, null, { uScene: RT.scene.t, uB1: RT.a1.t, uB2: RT.a2.t }, {
    uShake: [sh[0] / W, -sh[1] / H], uCA: S.ca, uZoomBlur: S.zoomBlur, uFlashScr: 0.12 * clamp(S.flash - 0.45, 0, 1.2),
    uFade: S.fade, uImpact: S.impact, uFrame: Math.round(t * FPS),
  });
  gl.finish();
  return Math.round(t * FPS);
}

// ---------------------------------------------------------------- boot
const IMAGES = {};
function load(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("load " + src)); i.src = src; }); }
window.SEGMENT = { name: "intro_stack", fps: FPS, duration: DURATION, frames: Math.round(DURATION * FPS) };
(async () => {
  [IMAGES.healthy, IMAGES.hurt] = await Promise.all([load("../../assets/video/stack_logo.png"), load(HURT_SRC[HURT_VARIANT])]);
  await document.fonts.load(`${TEXT_PX}px VT323`);
  layoutText();
  window.renderAt = renderAt;
  const q = new URLSearchParams(location.search);
  renderAt(q.has("t") ? parseFloat(q.get("t")) : 0);
  document.documentElement.dataset.ready = "1";
})().catch((e) => { document.documentElement.dataset.error = String(e); console.error(e); });
</script>
